<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b73">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>명소 도슨트</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef3f2;--fg:#14282c;--muted:#5d7176;--card:#fff;--line:#d3dedc;--accent:#0f6b73;--brass:#a87a1d;--ring:#c7d6d4;--bar:#d3dedc;--ok:#2e7d4f;--bad:#b3412f;--onacc:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1c1f;--fg:#e6efee;--muted:#93a9ad;--card:#172a2e;--line:#26403f;--accent:#56c2c9;--brass:#e0b24e;--ring:#2c4a4c;--bar:#26403f;--ok:#6fcf97;--bad:#ef8a78;--onacc:#0f1c1f}}
:root[data-theme="dark"]{--bg:#0f1c1f;--fg:#e6efee;--muted:#93a9ad;--card:#172a2e;--line:#26403f;--accent:#56c2c9;--brass:#e0b24e;--ring:#2c4a4c;--bar:#26403f;--ok:#6fcf97;--bad:#ef8a78;--onacc:#0f1c1f}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-family:"Noto Serif KR",Georgia,serif;font-size:19px;margin:0}
.hbtns{display:flex;gap:6px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;min-height:42px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn:focus-visible,.primary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{width:100%;border:0;background:var(--accent);color:var(--onacc);border-radius:14px;padding:14px;font-size:17px;font-weight:700;min-height:52px}
.primary:disabled{opacity:.5}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.panel label{display:block;font-size:14px;font-weight:700;margin:10px 0 6px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;min-height:48px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:12.5px;color:var(--muted);margin-top:8px}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0}
.or{font-size:13px;color:var(--muted);margin:14px 0 8px}
.checks{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px}
.checks div{display:flex;gap:8px;align-items:baseline;padding:2px 0}
.checks b{min-width:40px}
.s{color:var(--muted)}.s.ok{color:var(--ok)}.s.bad{color:var(--bad)}
.timer{height:4px;background:var(--bar);border-radius:2px;overflow:hidden;margin:0 0 14px}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left center}
.stage{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;margin-bottom:12px}
.dial svg{width:72px;height:72px;display:block}
#ringRot,#needle{transform-origin:66px 66px;transition:transform .25s linear}
.dist{font-family:"Noto Serif KR",Georgia,serif;font-size:26px;font-weight:700;line-height:1.1}
.dir{font-size:14px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.cat{font-size:12.5px;color:var(--brass);font-weight:700}
.name{font-family:"Noto Serif KR",Georgia,serif;font-size:24px;font-weight:700;line-height:1.3;margin:2px 0}
.year{font-size:13.5px;color:var(--muted);margin-bottom:10px;min-height:1em}
.story{font-size:15.5px;margin:0 0 12px}
.look{font-size:14.5px;margin:0 0 10px;padding:10px 12px;background:var(--bg);border-radius:10px}.look b{color:var(--accent)}
.fact{font-size:14px;color:var(--muted);border-left:3px solid var(--brass);padding-left:10px;margin:0}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 8px}
.row{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;font-size:14.5px}
.row span:last-child{color:var(--muted);white-space:nowrap;font-size:13px}
.row[aria-current="true"] span:first-child{font-weight:700;color:var(--accent)}
.list h2{font-size:13.5px;color:var(--muted);font-weight:500;margin:16px 0 6px}
.msg{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px;font-size:14.5px;color:var(--muted)}
.mapwrap{position:relative;margin:0 0 12px}
#map{height:300px;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:var(--card);z-index:0}
.mapbtn{position:absolute;right:10px;bottom:10px;z-index:500;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;min-height:36px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mapbtn[aria-pressed="true"]{color:var(--accent);font-weight:700}
.me-ic{position:relative;width:80px;height:80px}
.me-ic svg{position:absolute;inset:0;width:80px;height:80px;transition:transform .2s linear}
.me-dot{position:absolute;left:31px;top:31px;width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.pin{width:26px;height:26px;border-radius:50%;background:var(--card);border:2px solid var(--brass);color:var(--fg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pin.on{background:var(--accent);border-color:#fff;color:#fff;width:32px;height:32px;font-size:14px}
.leaflet-container{font-family:inherit}
.locbadge{position:absolute;left:10px;right:10px;top:10px;z-index:500;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.locbadge .l1{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.locbadge .l2{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}
.dot.g{background:#2e9e5b}.dot.y{background:#e0a400}.dot.r{background:#d64532}
.dot.live{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,158,91,.6)}100%{box-shadow:0 0 0 10px rgba(46,158,91,0)}}
@media (prefers-reduced-motion: reduce){.dot.live{animation:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){#ringRot,#needle{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>명소 도슨트</h1>
    <div class="hbtns">
      <button class="btn" id="setBtn" type="button">설정</button>
      <button class="btn" id="themeBtn" type="button" aria-label="화면 밝기 바꾸기">화면</button>
    </div>
  </header>

  <section id="settings" class="panel" hidden>
    <p>Claude API 키를 한 번만 넣어 두면 이 폰에만 저장돼요. 다른 사람에게는 보이지 않아요.</p>
    <label for="keyInput">API 키</label>
    <input class="field" id="keyInput" type="password" placeholder="sk-ant-로 시작하는 키" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label>설명 품질</label>
    <div class="seg">
      <button class="btn" type="button" data-model="claude-sonnet-5-5" id="mHigh">풍부하게</button>
      <button class="btn" type="button" data-model="claude-haiku-4-5-20251001" id="mFast">빠르고 저렴하게</button>
    </div>
    <button class="primary" id="saveBtn" type="button" style="margin-top:14px">저장</button>
    <div class="small" id="keyState"></div>
  </section>

  <section id="intro" class="panel">
    <p>폰을 들고 걸으면, 지금 바라보는 방향에 실제로 서 있는 건물과 명소를 하나씩 설명해 드려요. 몸을 돌리면 그쪽에 보이는 것으로 바로 바뀌어요.</p>
    <button class="primary" id="startBtn" type="button">내 위치로 시작하기</button>
    <div class="or">위치가 안 잡히면 지금 있는 곳을 적어 주세요</div>
    <form class="manual" id="manualForm" onsubmit="return false">
      <input class="field" id="manualInput" type="text" placeholder="예: 경복궁" autocomplete="off">
      <button class="btn" type="submit">찾기</button>
    </form>
  </section>

  <section id="main" hidden>
    <div class="checks">
      <div hidden><b>위치</b><span class="s" id="c-geo">대기 중</span></div>
      <div><b>방향</b><span class="s" id="c-dir">대기 중</span></div>
      <div><b>설명</b><span class="s" id="c-ai">대기 중</span></div>
    </div>
    <div class="mapwrap"><div class="locbadge" id="locBadge" aria-live="polite"><div class="l1"><span class="dot" id="locDot"></span><span id="locText">위치 찾는 중</span></div><div class="l2" id="locAddr">주소 확인 전</div></div><div id="map" role="region" aria-label="지도"></div><button class="mapbtn" id="followBtn" type="button" aria-pressed="true">내 위치 따라가기</button></div>
    <div class="timer" aria-hidden="true"><i id="bar"></i></div>
    <div id="content"></div>
    <div class="controls">
      <button class="btn" id="prevBtn" type="button">이전</button>
      <button class="btn" id="pauseBtn" type="button" aria-pressed="false">정지</button>
      <button class="btn" id="nextBtn" type="button">다음</button>
      <button class="btn" id="speakBtn" type="button" aria-pressed="false">음성</button>
    </div>
    <button class="btn" id="refreshBtn" type="button" style="width:100%">주변 다시 읽기</button>
    <form class="manual" id="manualForm2" style="margin-top:8px" onsubmit="return false">
      <input class="field" id="manualInput2" type="text" placeholder="다른 장소로 바꾸기" autocomplete="off">
      <button class="btn" type="submit">찾기</button>
    </form>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(function(){
  var INTERVAL=10, FOV=40, VIEW_M=250, OSM_REFETCH_M=120;
  var $=function(id){return document.getElementById(id);};
  var S={pos:null,acc:null,gpsOk:false,manualPos:false,heading:null,compass:false,gpsCourseAt:0,lastFixAt:0,firstFixAt:0,
    items:{},desc:{},pending:{},failed:{},osmAt:null,osmBusy:false,descBusy:false,
    currentId:null,recent:[],hist:[],remaining:INTERVAL,paused:false,speak:false,tick:null,address:'',view:[]};

  function lsGet(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  var cfg={key:lsGet('docent_key'),model:lsGet('docent_model')||'claude-sonnet-5-5'};

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function rad(d){return d*Math.PI/180;} function deg(r){return r*180/Math.PI;}
  function dist(a,b){var R=6371000,dA=rad(b.lat-a.lat),dO=rad(b.lng-a.lng);
    var h=Math.sin(dA/2)*Math.sin(dA/2)+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dO/2)*Math.sin(dO/2);return 2*R*Math.asin(Math.sqrt(h));}
  function bearing(a,b){var y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat));
    var x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return (deg(Math.atan2(y,x))+360)%360;}
  function n180(d){return((d+180)%360+360)%360-180;}
  function fmt(m){return m<1000?Math.round(m/5)*5+'m':(m/1000).toFixed(1)+'km';}
  function comp(b){return['북쪽','북동쪽','동쪽','남동쪽','남쪽','남서쪽','서쪽','북서쪽'][Math.round(b/45)%8];}
  function rel(r){var a=Math.abs(r),s=r>0?'오른쪽':'왼쪽';if(a<=15)return'바로 정면';if(a<=40)return s+' 앞';if(a<=105)return s;if(a<=150)return s+' 뒤';return'뒤쪽';}
  function check(id,t,c){var e=$(id);if(!e)return;e.textContent=t;e.className='s'+(c?' '+c:'');}
  function msg(t){$('content').innerHTML='<div class="msg">'+esc(t)+'</div>';}

  // settings
  function syncSettings(){$('mHigh').setAttribute('aria-pressed',String(cfg.model==='claude-sonnet-5-5'));$('mFast').setAttribute('aria-pressed',String(cfg.model!=='claude-sonnet-5-5'));
    $('keyState').textContent=cfg.key?'키 저장됨 (끝자리 '+cfg.key.slice(-4)+')':'아직 키가 없어요.';}
  $('mHigh').onclick=$('mFast').onclick=function(){cfg.model=this.getAttribute('data-model');syncSettings();};
  $('setBtn').onclick=function(){var s=$('settings');s.hidden=!s.hidden;if(!s.hidden){$('keyInput').value=cfg.key;syncSettings();}};
  $('saveBtn').onclick=function(){cfg.key=$('keyInput').value.trim();lsSet('docent_key',cfg.key);lsSet('docent_model',cfg.model);syncSettings();if(cfg.key){$('settings').hidden=true;S.failed={};}};
  if(!cfg.key){$('settings').hidden=false;syncSettings();}
  $('themeBtn').onclick=function(){var r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',d?'light':'dark');};

  // ---------- real surroundings from OpenStreetMap ----------
  var AMENITY_OK=/^(place_of_worship|townhall|theatre|library|university|college|school|courthouse|arts_centre|community_centre|hospital|fountain|clock|marketplace|embassy|cinema|post_office|bank|police|fire_station|monastery|grave_yard)$/;
  function osmKind(t){
    if(t.historic)return t.historic==='yes'?'역사 유적':'유적 ('+t.historic+')';
    if(t.tourism)return '관광 ('+t.tourism+')';
    if(t.amenity)return '시설 ('+t.amenity+')';
    if(t.man_made)return '구조물 ('+t.man_made+')';
    if(t.leisure)return '여가 ('+t.leisure+')';
    if(t.building)return '건물'+(t.building!=='yes'?' ('+t.building+')':'');
    return '장소';
  }
  function importance(t){var v=0;if(t.wikidata||t.wikipedia)v+=3;if(t.historic||t.heritage)v+=3;if(t.tourism&&t.tourism!=='hotel')v+=2;
    if(t.amenity==='place_of_worship'||t.amenity==='townhall'||t.amenity==='theatre')v+=2;if(t.start_date||t.architect)v+=1;if(t.building)v+=0.5;return v;}
  async function fetchOsm(){
    if(S.osmBusy||!S.pos)return;S.osmBusy=true;var at={lat:S.pos.lat,lng:S.pos.lng};
    check('c-ai','주변 실제 건물과 장소 확인 중');
    var q='[out:json][timeout:20];nwr(around:'+(VIEW_M+80)+','+at.lat.toFixed(6)+','+at.lng.toFixed(6)+')[name][~"^(historic|tourism|amenity|building|man_made|leisure|heritage|memorial|bridge)$"~"."];out center tags 250;';
    var urls=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter'],data=null;
    for(var i=0;i<urls.length&&!data;i++){try{var r=await fetch(urls[i],{method:'POST',body:'data='+encodeURIComponent(q),headers:{'content-type':'application/x-www-form-urlencoded'}});if(r.ok)data=await r.json();}catch(e){}}
    S.osmBusy=false;S.osmAt=at;
    if(!data){check('c-ai','지도 데이터를 못 받아서 Claude 추천으로 대신해요','bad');fallbackClaude();return;}
    var n=0;
    (data.elements||[]).forEach(function(e){
      var t=e.tags||{},lat=e.lat!=null?e.lat:(e.center&&e.center.lat),lng=e.lon!=null?e.lon:(e.center&&e.center.lon);
      if(lat==null||!t.name)return;
      if(t.amenity&&!AMENITY_OK.test(t.amenity)&&!t.historic&&!t.tourism&&!t.building)return;
      if(t.shop||t.office)return;
      var id=e.type[0]+e.id; if(S.items[id])return;
      S.items[id]={id:id,name:t['name:ko']||t.name,lat:lat,lng:lng,kind:osmKind(t),imp:importance(t),
        tags:[t.historic&&'historic='+t.historic,t.tourism&&'tourism='+t.tourism,t.amenity&&'amenity='+t.amenity,t.building&&'building='+t.building,
              t.man_made&&'man_made='+t.man_made,t.leisure&&'leisure='+t.leisure,t.religion&&'religion='+t.religion,t.denomination&&'denomination='+t.denomination,
              t.start_date&&'start_date='+t.start_date,t.architect&&'architect='+t.architect,t['building:levels']&&'levels='+t['building:levels'],
              t.heritage&&'heritage', (t.wikipedia||t.wikidata)&&'위키 등재', t['name:en']&&'en='+t['name:en']].filter(Boolean).join(', ')};
      n++;
    });
    if(Object.keys(S.items).length<3){fallbackClaude();return;}
    check('c-ai','주변 실제 장소 '+Object.keys(S.items).length+'곳 확인','ok');
    refreshView(true);
  }
  async function fallbackClaude(){
    if(!cfg.key||!S.pos)return;
    try{
      var res=await askClaude('여행자가 위도 '+S.pos.lat.toFixed(5)+', 경도 '+S.pos.lng.toFixed(5)+(S.address?' ('+S.address+')':'')+'에 서 있습니다. 반경 300m 안에서 눈에 보이는 실제 건물, 기념물, 성당, 다리, 광장 등을 최대 8개, 위치를 확신하는 것만 고르세요.\n'+
        'JSON만: {"items":[{"name":"","kind":"","year":"","lat":0,"lng":0,"story":"무엇이고 어떤 역사인지 2~3문장","look":"눈여겨볼 점 한 문장"}]}');
      (res.items||[]).forEach(function(x,i){var lat=+x.lat,lng=+x.lng;if(!x.name||!isFinite(lat)||!isFinite(lng)||dist(S.pos,{lat:lat,lng:lng})>500)return;
        var id='c'+Date.now()+i;S.items[id]={id:id,name:String(x.name),lat:lat,lng:lng,kind:String(x.kind||''),imp:2,tags:''};
        S.desc[id]={title:String(x.name),kind:String(x.kind||''),year:String(x.year||''),story:String(x.story||''),look:String(x.look||'')};});
      refreshView(true);
    }catch(e){reportErr(e);}
  }

  // ---------- what is in front of me ----------
  function computeView(){
    if(!S.pos)return[];
    var arr=[];
    Object.keys(S.items).forEach(function(id){var it=S.items[id],d=dist(S.pos,it);if(d>VIEW_M+50)return;
      var b=bearing(S.pos,it),r=S.heading==null?0:n180(b-S.heading),a=Math.abs(r);
      var inView=S.heading==null?true:(a<=FOV||d<25);
      var score=(Math.max(d,15)*(1+a/FOV))/(1+it.imp*0.5);
      arr.push({id:id,d:d,b:b,r:r,inView:inView,score:score});});
    arr.sort(function(x,y){return (y.inView-x.inView)||(x.score-y.score);});
    return arr;
  }
  var lastSwitch=0;
  function refreshView(force){
    S.view=computeView();
    var front=S.view.filter(function(v){return v.inView;});
    var cur=S.view.find(function(v){return v.id===S.currentId;});

  $('pauseBtn').onclick=function(){S.paused=!S.paused;this.setAttribute('aria-pressed',String(S.paused));this.textContent=S.paused?'재생':'정지';};
  $('speakBtn').onclick=function(){S.speak=!S.speak;this.setAttribute('aria-pressed',String(S.speak));if(S.speak)speak();else try{speechSynthesis.cancel();}catch(e){}};
  $('refreshBtn').onclick=function(){if(S.pos){S.items={};S.currentId=null;S.failed={};fetchOsm();}else $('manualInput2').focus();};
  async function keepAwake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen');}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.tick)keepAwake();});
  function enterMain(){$('intro').hidden=true;$('main').hidden=false;setTimeout(mapInit,0);startTicker();keepAwake();setInterval(badge,1000);}
  $('startBtn').onclick=function(){enterMain();msg('위치를 확인하는 중이에요.');startCompass();startGps();};
  async function manual(v){v=(v||'').trim();if(!v)return;if(!$('intro').hidden){enterMain();startCompass();}
    try{var r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ko&q='+encodeURIComponent(v));var d=await r.json();
      if(!d.length){msg('"'+v+'" 위치를 찾지 못했어요. 다른 이름으로 적어 주세요.');return;}
      if(!S.gpsOk){S.pos={lat:+d[0].lat,lng:+d[0].lon};S.manualPos=true;S.acc=null;S.items={};S.currentId=null;
        if(M.map)M.map.setView([S.pos.lat,S.pos.lng],17);mapUpdateMe(true);revGeo(true);badge();fetchOsm();}
      else msg('GPS가 켜져 있어서 실제 위치 기준으로 보여 드려요.');}
    catch(e){msg('장소 검색에 실패했어요. 인터넷 연결을 확인해 주세요.');}}
  $('manualForm').addEventListener('submit',function(){manual($('manualInput').value);});
  $('manualForm2').addEventListener('submit',function(){manual($('manualInput2').value);$('manualInput2').value='';});
})();
</script>
</body>
</html>
