<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b73">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>명소 도슨트</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef3f2;--fg:#14282c;--muted:#5d7176;--card:#fff;--line:#d3dedc;--accent:#0f6b73;--brass:#a87a1d;--ring:#c7d6d4;--bar:#d3dedc;--ok:#2e7d4f;--bad:#b3412f;--onacc:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1c1f;--fg:#e6efee;--muted:#93a9ad;--card:#172a2e;--line:#26403f;--accent:#56c2c9;--brass:#e0b24e;--ring:#2c4a4c;--bar:#26403f;--ok:#6fcf97;--bad:#ef8a78;--onacc:#0f1c1f}}
:root[data-theme="dark"]{--bg:#0f1c1f;--fg:#e6efee;--muted:#93a9ad;--card:#172a2e;--line:#26403f;--accent:#56c2c9;--brass:#e0b24e;--ring:#2c4a4c;--bar:#26403f;--ok:#6fcf97;--bad:#ef8a78;--onacc:#0f1c1f}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-family:"Noto Serif KR",Georgia,serif;font-size:19px;margin:0}
.hbtns{display:flex;gap:6px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;min-height:42px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn:focus-visible,.primary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{width:100%;border:0;background:var(--accent);color:var(--onacc);border-radius:14px;padding:14px;font-size:17px;font-weight:700;min-height:52px}
.primary:disabled{opacity:.5}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.panel label{display:block;font-size:14px;font-weight:700;margin:10px 0 6px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;min-height:48px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:12.5px;color:var(--muted);margin-top:8px}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0}
.or{font-size:13px;color:var(--muted);margin:14px 0 8px}
.checks{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px}
.checks div{display:flex;gap:8px;align-items:baseline;padding:2px 0}
.checks b{min-width:40px}
.s{color:var(--muted)}.s.ok{color:var(--ok)}.s.bad{color:var(--bad)}
.timer{height:4px;background:var(--bar);border-radius:2px;overflow:hidden;margin:0 0 14px}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left center}
.stage{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;margin-bottom:12px}
.dial svg{width:120px;height:120px;display:block}
#ringRot,#needle{transform-origin:66px 66px;transition:transform .25s linear}
.dist{font-family:"Noto Serif KR",Georgia,serif;font-size:30px;font-weight:700;line-height:1.1}
.dir{font-size:14px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.cat{font-size:12.5px;color:var(--brass);font-weight:700}
.name{font-family:"Noto Serif KR",Georgia,serif;font-size:24px;font-weight:700;line-height:1.3;margin:2px 0}
.year{font-size:13.5px;color:var(--muted);margin-bottom:10px;min-height:1em}
.story{font-size:15.5px;margin:0 0 12px}
.look{font-size:14.5px;margin:0 0 10px;padding:10px 12px;background:var(--bg);border-radius:10px}.look b{color:var(--accent)}
.fact{font-size:14px;color:var(--muted);border-left:3px solid var(--brass);padding-left:10px;margin:0}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 8px}
.row{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;font-size:14.5px}
.row span:last-child{color:var(--muted);white-space:nowrap;font-size:13px}
.row[aria-current="true"] span:first-child{font-weight:700;color:var(--accent)}
.list h2{font-size:13.5px;color:var(--muted);font-weight:500;margin:16px 0 6px}
.msg{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px;font-size:14.5px;color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){#ringRot,#needle{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>명소 도슨트</h1>
    <div class="hbtns">
      <button class="btn" id="setBtn" type="button">설정</button>
      <button class="btn" id="themeBtn" type="button" aria-label="화면 밝기 바꾸기">화면</button>
    </div>
  </header>

  <section id="settings" class="panel" hidden>
    <p>Claude API 키를 한 번만 넣어 두면 이 폰에만 저장돼요. 다른 사람에게는 보이지 않아요.</p>
    <label for="keyInput">API 키</label>
    <input class="field" id="keyInput" type="password" placeholder="sk-ant-로 시작하는 키" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label>설명 품질</label>
    <div class="seg">
      <button class="btn" type="button" data-model="claude-sonnet-5-5" id="mHigh">풍부하게</button>
      <button class="btn" type="button" data-model="claude-haiku-4-5-20251001" id="mFast">빠르고 저렴하게</button>
    </div>
    <button class="primary" id="saveBtn" type="button" style="margin-top:14px">저장</button>
    <div class="small" id="keyState"></div>
  </section>

  <section id="intro" class="panel">
    <p>걸으면서 켜 두세요. 위치와 바라보는 방향을 계속 읽고, 근처 명소와 역사 깊은 건물 이야기를 10초마다 하나씩 들려 드려요. 300m쯤 움직이면 새 명소를 찾아요.</p>
    <button class="primary" id="startBtn" type="button">내 위치로 시작하기</button>
    <div class="or">위치가 안 잡히면 지금 있는 곳을 적어 주세요</div>
    <form class="manual" id="manualForm" onsubmit="return false">
      <input class="field" id="manualInput" type="text" placeholder="예: 경복궁" autocomplete="off">
      <button class="btn" type="submit">찾기</button>
    </form>
  </section>

  <section id="main" hidden>
    <div class="checks">
      <div><b>위치</b><span class="s" id="c-geo">대기 중</span></div>
      <div><b>방향</b><span class="s" id="c-dir">대기 중</span></div>
      <div><b>설명</b><span class="s" id="c-ai">대기 중</span></div>
    </div>
    <div class="timer" aria-hidden="true"><i id="bar"></i></div>
    <div id="content"></div>
    <div class="controls">
      <button class="btn" id="prevBtn" type="button">이전</button>
      <button class="btn" id="pauseBtn" type="button" aria-pressed="false">정지</button>
      <button class="btn" id="nextBtn" type="button">다음</button>
      <button class="btn" id="speakBtn" type="button" aria-pressed="false">음성</button>
    </div>
    <button class="btn" id="refreshBtn" type="button" style="width:100%">여기서 새로 찾기</button>
    <form class="manual" id="manualForm2" style="margin-top:8px" onsubmit="return false">
      <input class="field" id="manualInput2" type="text" placeholder="다른 장소로 바꾸기" autocomplete="off">
      <button class="btn" type="submit">찾기</button>
    </form>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(function(){
  var INTERVAL=10, REFETCH_METERS=300, MIN_GAP_MS=60000;
  var $=function(id){return document.getElementById(id);};
  var S={pos:null,gpsOk:false,manualPos:false,heading:null,compass:false,places:[],shown:{},current:-1,
         remaining:INTERVAL,paused:false,speak:false,fetching:false,lastFetch:null,lastFetchAt:0,hist:[],seen:[],tick:null};

  // storage
  function lsGet(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  var cfg={key:lsGet('docent_key'),model:lsGet('docent_model')||'claude-sonnet-5-5'};

  // helpers
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function rad(d){return d*Math.PI/180;} function deg(r){return r*180/Math.PI;}
  function dist(a,b){var R=6371000,dA=rad(b.lat-a.lat),dO=rad(b.lng-a.lng);
    var h=Math.sin(dA/2)*Math.sin(dA/2)+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dO/2)*Math.sin(dO/2);return 2*R*Math.asin(Math.sqrt(h));}
  function bearing(a,b){var y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat));
    var x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return (deg(Math.atan2(y,x))+360)%360;}
  function n180(d){return((d+180)%360+360)%360-180;}
  function fmt(m){return m<1000?Math.round(m/10)*10+'m':(m/1000).toFixed(1)+'km';}
  function comp(b){return['북쪽','북동쪽','동쪽','남동쪽','남쪽','남서쪽','서쪽','북서쪽'][Math.round(b/45)%8];}
  function rel(r){var a=Math.abs(r),s=r>0?'오른쪽':'왼쪽';if(a<=30)return'정면';if(a<=75)return s+' 앞';if(a<=105)return s;if(a<=150)return s+' 뒤';return'뒤쪽';}
  function check(id,t,c){var e=$(id);e.textContent=t;e.className='s'+(c?' '+c:'');}
  function msg(t){$('content').innerHTML='<div class="msg">'+esc(t)+'</div>';}

  // settings UI
  function syncSettings(){
    $('mHigh').setAttribute('aria-pressed',String(cfg.model==='claude-sonnet-5-5'));
    $('mFast').setAttribute('aria-pressed',String(cfg.model!=='claude-sonnet-5-5'));
    $('keyState').textContent=cfg.key?'키 저장됨 (끝자리 '+cfg.key.slice(-4)+')':'아직 키가 없어요.';
  }
  $('mHigh').onclick=$('mFast').onclick=function(){cfg.model=this.getAttribute('data-model');syncSettings();};
  $('setBtn').onclick=function(){var s=$('settings');s.hidden=!s.hidden;if(!s.hidden){$('keyInput').value=cfg.key;syncSettings();}};
  $('saveBtn').onclick=function(){
    cfg.key=$('keyInput').value.trim(); lsSet('docent_key',cfg.key); lsSet('docent_model',cfg.model); syncSettings();
    if(cfg.key){$('settings').hidden=true; if(S.pos&&!S.places.length) fetchPlaces(null,true);}
  };
  if(!cfg.key){$('settings').hidden=false;syncSettings();}
  $('themeBtn').onclick=function(){var r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',d?'light':'dark');};

  // Claude API
  async function askClaude(prompt){
    var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
      'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:cfg.model,max_tokens:4000,messages:[{role:'user',content:prompt}]})});
    if(!r.ok){var t='';try{var j=await r.json();t=(j.error&&j.error.message)||'';}catch(e){}
      var err=new Error(t||('HTTP '+r.status));err.status=r.status;throw err;}
    var d=await r.json();
    var text=(d.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
    text=text.replace(/```json|```/g,'').trim();
    var a=text.indexOf('{'),b=text.lastIndexOf('}');
    if(a<0||b<a) throw new Error('답 형식 오류');
    return JSON.parse(text.slice(a,b+1));
  }
  function buildPrompt(where){
    return ['당신은 그 도시를 잘 아는 노련한 현지 도슨트입니다. 여행자가 지금 '+where+'에 있습니다.',
      'center에는 기준점의 실제 좌표와 짧은 이름을 넣으세요.',
      '주변 1.5km 이내의 유명 명소, 역사 깊은 건물, 기념물, 상징적인 거리와 장소를 8곳 고르세요. 실제로 존재하고 위치를 확신하는 곳만.',
      S.seen.length?'이미 소개한 곳은 빼세요: '+S.seen.slice(-40).join(', ')+'.':'',
      'lat, lng는 소수점 5자리 실제 좌표.',
      'story: 역사, 지어진 배경, 얽힌 인물과 사건을 옆에서 들려주듯 생생하게 3~4문장.',
      'look: 현장에서 꼭 눈여겨볼 포인트 한 문장. fact: 잘 알려지지 않은 흥미로운 사실 한 문장.',
      'year: 건립이나 시작 시기 (예: 1395년). 모르면 빈 문자열.',
      '모든 글은 한국어. 오직 JSON 객체 하나만 답하세요. 형식:',
      '{"center":{"lat":0,"lng":0,"label":""},"places":[{"name":"","category":"","year":"","lat":0,"lng":0,"story":"","look":"","fact":""}]}'
    ].filter(Boolean).join('\n');
  }

  async function fetchPlaces(query,force){
    if(S.fetching) return;
    if(!cfg.key){check('c-ai','설정에서 API 키를 넣어 주세요','bad');$('settings').hidden=false;syncSettings();if(!S.places.length)msg('위 설정 칸에 API 키를 넣고 저장하면 바로 시작해요.');return;}
    if(!query&&!S.pos) return;
    if(!query&&!force&&Date.now()-S.lastFetchAt<MIN_GAP_MS) return;
    S.fetching=true; var t0=Date.now(), origin=S.pos?{lat:S.pos.lat,lng:S.pos.lng}:null;
    if(!S.places.length) msg('Claude가 주변 명소를 고르고 있어요.');
    var tm=setInterval(function(){check('c-ai','명소 이야기 준비 중 '+Math.round((Date.now()-t0)/1000)+'초');},1000);
    check('c-ai','명소 이야기 준비 중');
    try{
      var where=query?'"'+query+'"':'위도 '+origin.lat.toFixed(5)+', 경도 '+origin.lng.toFixed(5)+' 지점';
      var res=await askClaude(buildPrompt(where));
      var c=res.center, center=c&&isFinite(+c.lat)&&isFinite(+c.lng)?{lat:+c.lat,lng:+c.lng}:origin;
      if(query&&!S.gpsOk&&center){S.pos=center;S.manualPos=true;}
      var base=S.pos||center, out=[];
      (Array.isArray(res.places)?res.places:[]).forEach(function(x){
        if(!x||!x.name)return; var lat=+x.lat,lng=+x.lng; if(!isFinite(lat)||!isFinite(lng))return;
        if(base&&dist(base,{lat:lat,lng:lng})>4000)return;
        if(S.seen.indexOf(String(x.name))>=0)return;
        out.push({name:String(x.name),category:String(x.category||'명소'),year:String(x.year||''),lat:lat,lng:lng,
          story:String(x.story||''),look:String(x.look||''),fact:String(x.fact||'')});
      });
      S.lastFetch=base; S.lastFetchAt=Date.now();
      if(!out.length){check('c-ai','새로 소개할 곳이 없어요. 조금 더 걸어 보세요','bad');if(!S.places.length)msg('이 근처에서 소개할 곳을 찾지 못했어요.');return;}
      check('c-ai',((c&&c.label)?c.label+' 주변 ':'')+out.length+'곳 ('+Math.round((Date.now()-t0)/1000)+'초)','ok');
      S.places=out;S.shown={};S.current=-1;S.hist=[];advance();renderList();
    }catch(e){
      var t;
      if(e.status===401)t='API 키가 맞지 않아요. 설정에서 다시 넣어 주세요.';
      else if(e.status===400&&/credit|balance/i.test(e.message))t='API 크레딧이 부족해요. 결제 상태를 확인해 주세요.';
      else if(e.status===404)t='모델을 찾을 수 없어요. 설정에서 다른 품질을 골라 주세요.';
      else if(e.status===429)t='요청이 많아요. 1분 뒤 다시 찾기를 눌러 주세요.';
      else if(e.status===529||e.status>=500)t='Claude가 바빠요. 잠시 뒤 다시 찾기를 눌러 주세요.';
      else t='불러오지 못했어요 ('+e.message+'). 다시 찾기를 눌러 주세요.';
      check('c-ai',t,'bad'); if(!S.places.length)msg(t);
      S.lastFetch=S.lastFetch||origin; S.lastFetchAt=Date.now();
    }finally{clearInterval(tm);S.fetching=false;}
  }

  // compass
  function onOrient(e){
    var h=null;
    if(typeof e.webkitCompassHeading==='number'&&!isNaN(e.webkitCompassHeading))h=e.webkitCompassHeading;
    else if((e.absolute===true||e.type==='deviceorientationabsolute')&&typeof e.alpha==='number')h=(360-e.alpha)%360;
    if(h==null)return;
    if(screen.orientation&&typeof screen.orientation.angle==='number')h=(h+screen.orientation.angle)%360;
    if(!S.compass){S.compass=true;check('c-dir','나침반 작동 중','ok');}
    S.heading=S.heading==null?h:(S.heading+n180(h-S.heading)*0.25+360)%360;
    drawThrottled();
  }
  async function startCompass(){
    try{
      if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
        var r=await DeviceOrientationEvent.requestPermission();
        if(r!=='granted'){check('c-dir','방향 권한이 거부됐어요. 걸을 때 이동 방향으로 대신해요.','bad');return;}
      }
    }catch(e){check('c-dir','방향 권한을 받지 못했어요. 이동 방향으로 대신해요.','bad');return;}
    window.addEventListener('deviceorientationabsolute',onOrient,true);
    window.addEventListener('deviceorientation',onOrient,true);
    check('c-dir','나침반 신호 기다리는 중');
    setTimeout(function(){if(!S.compass)check('c-dir','나침반 신호가 없어요. 이동 방향으로 대신해요.','bad');},4000);
  }

  // GPS
  function startGps(){
    if(!navigator.geolocation){gpsFail('이 기기에서 위치를 쓸 수 없어요.');return;}
    if(!window.isSecureContext){gpsFail('https 주소로 열어야 위치가 켜져요.');return;}
    check('c-geo','위치 권한을 허용해 주세요');
    var got=false, ft=setTimeout(function(){if(!got)gpsFail('20초 동안 위치 응답이 없어요. 실외로 나가 보세요.');},20000);
    navigator.geolocation.watchPosition(function(p){got=true;clearTimeout(ft);onPos(p);},function(err){
      if(got&&err.code===3)return; clearTimeout(ft);
      gpsFail(err.code===1?'위치 권한이 거부됐어요. 브라우저 설정에서 이 사이트 위치를 허용해 주세요.':err.code===2?'현재 위치를 알 수 없어요.':'위치 응답이 늦어요.');
    },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  }
  function gpsFail(t){if(S.gpsOk)return;check('c-geo',t,'bad');if(!S.places.length&&!S.fetching)msg(t+' 아래 칸에 지금 있는 곳을 적어도 돼요.');}
  function onPos(p){
    var c=p.coords; S.pos={lat:c.latitude,lng:c.longitude}; S.gpsOk=true; S.manualPos=false;
    check('c-geo','GPS 작동 중 (오차 약 '+Math.round(c.accuracy)+'m)','ok');
    if(!S.compass&&typeof c.heading==='number'&&!isNaN(c.heading)&&c.speed>0.8)S.heading=c.heading;
    if(!S.lastFetch)fetchPlaces(null,true);
    else if(dist(S.lastFetch,S.pos)>REFETCH_METERS)fetchPlaces(null,false);
    draw(); updateDistances();
  }

  // rotation
  function pickNext(){
    var n=S.places.length;if(!n)return-1;var cand=[];
    for(var i=0;i<n;i++)if(!S.shown[i]&&i!==S.current)cand.push(i);
    if(!cand.length){S.shown={};for(var j=0;j<n;j++)if(j!==S.current)cand.push(j);}
    if(!cand.length)return S.current;
    var best=cand[0],bs=Infinity;
    cand.forEach(function(i){var p=S.places[i],d=S.pos?dist(S.pos,p):1000,s=d;
      if(S.pos&&S.heading!=null)s=d*(1+Math.abs(n180(bearing(S.pos,p)-S.heading))/120);
      if(s<bs){bs=s;best=i;}});
    return best;
  }
  function advance(){var i=pickNext();if(i>=0)show(i,true);}
  function show(i,record){
    if(record&&S.current>=0&&S.current!==i){S.hist.push(S.current);if(S.hist.length>30)S.hist.shift();}
    S.current=i;S.shown[i]=true;S.remaining=INTERVAL;
    var p=S.places[i];if(S.seen.indexOf(p.name)<0)S.seen.push(p.name);
    renderCard();renderList();draw();if(S.speak)speak();
  }

  // render
  function dialSvg(){var t='';
    for(var a=0;a<360;a+=30){var r1=a%90===0?50:54;
      t+='<line x1="'+(66+r1*Math.sin(rad(a))).toFixed(1)+'" y1="'+(66-r1*Math.cos(rad(a))).toFixed(1)+'" x2="'+(66+58*Math.sin(rad(a))).toFixed(1)+'" y2="'+(66-58*Math.cos(rad(a))).toFixed(1)+'" stroke="var(--muted)" stroke-width="1.5"/>';}
    return '<svg viewBox="0 0 132 132" role="img" aria-label="명소 방향"><circle cx="66" cy="66" r="62" fill="var(--card)" stroke="var(--ring)" stroke-width="2"/>'+
      '<g id="ringRot">'+t+'<text x="66" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="var(--brass)">북</text></g>'+
      '<g id="needle"><path d="M66 18 L75 66 L66 60 L57 66 Z" fill="var(--accent)"/><circle cx="66" cy="66" r="3.5" fill="var(--fg)"/></g>'+
      '<path d="M66 2 L62 9 L70 9 Z" fill="var(--fg)" opacity=".55"/></svg>';}
  function renderCard(){var p=S.places[S.current];if(!p)return;
    $('content').innerHTML='<div class="stage"><div class="dial">'+dialSvg()+'</div><div><div class="dist" id="dist">-</div><div class="dir" id="dirText"></div></div></div>'+
      '<article class="card"><span class="cat">'+esc(p.category)+'</span><h2 class="name">'+esc(p.name)+'</h2><div class="year">'+esc(p.year)+'</div>'+
      '<p class="story">'+esc(p.story)+'</p>'+(p.look?'<p class="look"><b>여기를 보세요</b> '+esc(p.look)+'</p>':'')+
      (p.fact?'<p class="fact">'+esc(p.fact)+'</p>':'')+'</article>';}
  var ringA=0,needleA=0,last=0;
  function drawThrottled(){var n=Date.now();if(n-last>200){last=n;draw();}}
  function draw(){var ring=$('ringRot'),nd=$('needle');if(!ring)return;var p=S.places[S.current];
    ringA+=n180((S.heading==null?0:-S.heading)-ringA);ring.style.transform='rotate('+ringA+'deg)';
    if(p&&S.pos){var d=dist(S.pos,p),b=bearing(S.pos,p),r=S.heading==null?b:n180(b-S.heading);
      needleA+=n180(r-needleA);nd.style.transform='rotate('+needleA+'deg)';
      $('dist').textContent=d<40?'바로 여기':fmt(d);
      $('dirText').textContent=S.heading==null?comp(b)+'에 있어요':rel(r)+'에 있어요';}}
  function renderList(){if(!S.places.length){$('list').innerHTML='';return;}
    $('list').innerHTML='<h2>근처 명소</h2>'+S.places.map(function(p,i){return '<button class="row" type="button" data-i="'+i+'"'+(i===S.current?' aria-current="true"':'')+'><span>'+esc(p.name)+'</span><span>'+(S.pos?fmt(dist(S.pos,p)):'')+'</span></button>';}).join('');}
  function updateDistances(){document.querySelectorAll('#list .row').forEach(function(r){var p=S.places[+r.getAttribute('data-i')];if(p&&S.pos)r.lastChild.textContent=fmt(dist(S.pos,p));});}
  $('list').addEventListener('click',function(e){var b=e.target.closest('.row');if(b)show(+b.getAttribute('data-i'),true);});

  // timer, speech, controls
  function startTicker(){if(S.tick)return;S.tick=setInterval(function(){
    if(!S.paused&&S.places.length){S.remaining-=0.25;if(S.remaining<=0)advance();}
    $('bar').style.transform='scaleX('+Math.max(0,Math.min(1,S.remaining/INTERVAL))+')';},250);}
  function speak(){if(!('speechSynthesis' in window))return;var p=S.places[S.current];if(!p)return;
    try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(p.name+'. '+p.story+' '+p.look);u.lang='ko-KR';speechSynthesis.speak(u);}catch(e){}}
  $('nextBtn').onclick=function(){advance();};
  $('prevBtn').onclick=function(){if(S.hist.length)show(S.hist.pop(),false);};
  $('pauseBtn').onclick=function(){S.paused=!S.paused;this.setAttribute('aria-pressed',String(S.paused));this.textContent=S.paused?'재생':'정지';};
  $('speakBtn').onclick=function(){S.speak=!S.speak;this.setAttribute('aria-pressed',String(S.speak));if(S.speak)speak();else try{speechSynthesis.cancel();}catch(e){}};
  $('refreshBtn').onclick=function(){if(S.pos)fetchPlaces(null,true);else $('manualInput2').focus();};
  async function keepAwake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen');}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.tick)keepAwake();});
  function enterMain(){$('intro').hidden=true;$('main').hidden=false;startTicker();keepAwake();}
  $('startBtn').onclick=function(){enterMain();msg('위치를 확인하는 중이에요.');startCompass();startGps();};
  function manual(v){v=(v||'').trim();if(!v)return;if(!$('intro').hidden){enterMain();startCompass();}
    if(!S.gpsOk)check('c-geo','입력한 장소 기준: '+v);S.places=[];renderList();fetchPlaces(v,true);}
  $('manualForm').addEventListener('submit',function(){manual($('manualInput').value);});
  $('manualForm2').addEventListener('submit',function(){manual($('manualInput2').value);$('manualInput2').value='';});
})();
</script>
</body>
</html>
