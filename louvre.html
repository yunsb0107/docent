<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b2b2b">
<title>루브르 그림 도슨트</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f5f1ea;--fg:#231a16;--muted:#6f625a;--card:#fff;--line:#e2d8cc;--accent:#7a2e2e;--gold:#a8822a;--onacc:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171211;--fg:#efe6dd;--muted:#a8998e;--card:#221b19;--line:#3a2f2b;--accent:#e08a7a;--gold:#e0b65a;--onacc:#171211}}
:root[data-theme="dark"]{--bg:#171211;--fg:#efe6dd;--muted:#a8998e;--card:#221b19;--line:#3a2f2b;--accent:#e08a7a;--gold:#e0b65a;--onacc:#171211}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-family:"Noto Serif KR",Georgia,serif;font-size:19px;margin:0}
.hb{display:flex;gap:6px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;min-height:42px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn:focus-visible,.primary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{border:0;background:var(--accent);color:var(--onacc);border-radius:12px;padding:10px 16px;font-size:16px;font-weight:700;min-height:48px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:14px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;min-height:48px}
.room{display:grid;grid-template-columns:48px 1fr 48px auto;gap:8px;align-items:center}
.room input{text-align:center;font-size:22px;font-weight:700;font-family:"Noto Serif KR",Georgia,serif}
.gps{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}.dot.g{background:#2e9e5b}.dot.y{background:#e0a400}.dot.r{background:#d64532}
.status{font-size:13px;color:var(--muted);min-height:20px;margin:4px 2px 8px}.status.bad{color:#c0392b}
.roomname{font-size:13.5px;color:var(--gold);font-weight:700;margin:0 2px 6px}
.timer{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 0 12px}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.img{width:100%;max-height:300px;object-fit:contain;background:#000;display:block}
.cb{padding:16px 18px 18px}
.meta{font-size:13px;color:var(--gold);font-weight:700}
.title{font-family:"Noto Serif KR",Georgia,serif;font-size:24px;font-weight:700;line-height:1.3;margin:2px 0}
.sub{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.where{font-size:13.5px;margin:0 0 12px;padding:8px 10px;background:var(--bg);border-radius:10px}
.desc{font-size:16px;margin:0 0 12px}
.desc.wait{color:var(--muted)}
.src{font-size:12.5px;color:var(--muted)}.src a{color:var(--accent)}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;font-size:14.5px}
.row span:last-child{color:var(--muted);font-size:12.5px;white-space:nowrap}
.row[aria-current="true"] span:first-child{font-weight:700;color:var(--accent)}
.list h2{font-size:13.5px;color:var(--muted);font-weight:500;margin:14px 0 4px}
.msg{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px;font-size:14.5px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13.5px;min-height:36px}.chip[aria-pressed="true"]{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.img{min-height:120px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>루브르 그림 도슨트</h1>
    <div class="hb"><button class="btn" id="setBtn" type="button">설정</button><button class="btn" id="themeBtn" type="button" aria-label="화면 밝기">화면</button></div>
  </header>

  <section id="settings" class="panel" hidden>
    <p>Claude API 키 (명소 도슨트에 넣은 키가 있으면 자동으로 써요)</p>
    <input class="field" id="keyInput" type="password" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="primary" id="saveBtn" type="button" style="margin-top:10px;width:100%">저장</button>
  </section>

  <section class="panel">
    <p>지금 있는 방 번호를 넣거나 아래 번호를 누르세요. 주요 방의 설명은 미리 넣어 둬서 인터넷이 느려도 바로 떠요.</p>
    <form class="room" id="roomForm" onsubmit="return false">
      <button class="btn" type="button" id="minus" aria-label="이전 방">−</button>
      <input class="field" id="roomInput" inputmode="numeric" value="700" aria-label="방 번호">
      <button class="btn" type="button" id="plus" aria-label="다음 방">+</button>
      <button class="primary" type="submit">보기</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="gps"><span class="dot" id="gDot"></span><span id="gText">위치 확인 중</span></div>
  </section>

  <div class="roomname" id="roomName"></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="timer" aria-hidden="true"><i id="bar"></i></div>
  <div id="content"><div class="msg">방 번호를 넣고 보기를 누르세요.</div></div>
  <div class="controls">
    <button class="btn" id="prevBtn" type="button">이전</button>
    <button class="btn" id="pauseBtn" type="button" aria-pressed="false">정지</button>
    <button class="btn" id="nextBtn" type="button">다음</button>
    <button class="btn" id="speakBtn" type="button" aria-pressed="false">음성</button>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
var PRE={"rooms": {"700": "Salle Mollien (몰리앵관)", "701": "살롱 드농 (Salle Denon)", "702": "Salle Daru (다뤼관)", "703": "Escalier Daru (다뤼 계단 상부)", "704": "드농관 1층 프랑스 회화", "705": "드농관 1층 프랑스 회화", "706": "드농관 1층 프랑스 회화", "710": "그랑 갤러리 (이탈리아 회화, 13~15세기 및 레오나르도 작품)", "711": "Salle des États (국가의 방)", "712": "그랑 갤러리 (이탈리아 회화)", "707": "드농관 이탈리아 회화 (그랑드 갤러리)", "708": "드농관 이탈리아 회화 (그랑드 갤러리, 15세기 피렌체)", "709": "드농관 이탈리아 회화 (그랑드 갤러리, 13~14세기 프리미티브)", "713": "드농관 이탈리아·스페인 회화", "714": "드농관 이탈리아·스페인 회화", "715": "드농관 이탈리아·스페인 회화", "716": "드농관 이탈리아·스페인 회화", "345": "밀로의 비너스", "403": "Galerie Michel-Ange (미켈란젤로 갤러리)", "227": "함무라비 법전 (고대 근동)", "229": "코르사바드 안뜰 (아시리아)", "338": "타니스의 대스핑크스 (지하실)", "801": "메디치 갤러리", "837": "네덜란드 회화", "940": "19세기 프랑스 회화 (앵그르)"}, "items": [{"title": "메두사호의 뗏목", "fr": "Le Radeau de la Méduse", "artist": "테오도르 제리코", "year": "1818-1819", "room": "700", "namu": "메두사호의 뗏목", "en_wiki": "The Raft of the Medusa", "where": "", "fame": 5, "d": {"s": ["이 그림은 1816년 아프리카 서해안에서 난파된 프랑스 군함 메두사호 사건을 소재로 제리코가 1818년부터 1819년에 걸쳐 완성한 유화작품입니다.", "150여 명의 생존자들이 뗏목에 의지해 표류하다가 대부분 사망한 실제 참사를 화면에 담았으며, 이 작품은 당대 프랑스 사회에 큰 충격을 주었습니다.", "죽음의 공포 속에서 생존을 위해 몸부림치는 인간들의 투쟁과 절망, 그리고 희망을 역동적인 구도와 강렬한 색감으로 표현하고 있습니다.", "화면의 우측 상단을 보면 희미하게 구조선박의 돛이 나타나 있으며, 전경의 인물들은 생존 여부가 불확실한 긴장감 속에서 각자의 방식으로 절망을 표현합니다.", "이 작품은 단순한 역사 기록화를 넘어 인간 조건의 본질적 고통을 탐구한 낭만주의 미술의 걸작으로 평가되고 있습니다."], "src": "namu", "url": "https://namu.wiki/w/%ED%85%8C%EC%98%A4%EB%8F%84%EB%A5%B4%20%EC%A0%9C%EB%A6%AC%EC%BD%94"}}, {"title": "민중을 이끄는 자유의 여신", "fr": "La Liberté guidant le peuple", "artist": "외젠 들라크루아", "year": "1830", "room": "700", "namu": "민중을 이끄는 자유의 여신", "en_wiki": "Liberty Leading the People", "where": "", "fame": 5, "d": {"s": ["이 그림은 프랑스 화가 외젠 들라크루아가 1830년 7월에 일어난 혁명을 기념하기 위해 그린 작품으로, 삼색기를 들고 민중을 이끄는 자유의 여신이 그 중심에 있습니다.", "흔히 1789년 프랑스 혁명을 상징하는 그림으로 알려져 있지만, 실제로는 41년 뒤인 1830년의 7월 혁명으로 기존 왕 샤를 10세를 몰아내고 루이필리프 1세가 입헌군주로 즉위한 사건을 그린 것입니다.", "그림 속 자유의 여신은 로마 신화의 여신이면서 동시에 프랑스 국가를 의인화한 마리안이라 볼 수 있으며, 그 옆의 소총을 든 신사는 화가 본인의 모습이라고도 해석됩니다.", "전체 구성은 여신의 왼편으로 총을 든 신사, 오른편으로 쌍권총을 든 소년 등 다양한 계층의 인물들이 함께 진군하는 형태이며, 앞쪽에는 쓰러진 전사자들의 모습도 보이는데 이는 혁명의 치열함을 나타냅니다.", "이 작품은 무명의 화가 들라크루아를 단숨에 유명하게 만들었으며, 그 이후로 세계의 여러 민주화 운동과 저항 운동의 상징으로 무수히 패러디되어 왔습니다."], "src": "namu", "url": "https://namu.wiki/w/%EB%AF%BC%EC%A4%91%EC%9D%84%20%EC%9D%B4%EB%81%84%EB%8A%94%20%EC%9E%90%EC%9C%A0%EC%9D%98%20%EC%97%AC%EC%8B%A0"}}, {"title": "사르다나팔루스의 죽음", "fr": "La Mort de Sardanapale", "artist": "외젠 들라크루아", "year": "1827", "room": "700", "namu": "사르다나팔루스의 죽음", "en_wiki": "The Death of Sardanapalus", "where": "", "fame": 4, "d": {"s": ["이 그림은 고대 앗시리아의 마지막 왕 사르다나팔루스가 적군의 포위 속에서 자신의 궁전을 불사르고 죽음을 맞이하는 장면을 그린 역사화입니다.", "19세기 낭만주의 화가 외젠 들라크루아가 고대 극작가 아이스킬로스의 희곡과 역사 기록에서 영감을 받아 1827년에 완성한 이 작품은, 그 규모와 극적 표현으로 살롱에서 센세이션을 불러일으켰습니다.", "회화의 낭만주의 정신을 대표하는 작품으로, 역사적 주제를 통해 인간의 극단적 감정, 죽음 앞에서의 절망과 결연함을 표현하고자 했습니다.", "화면 중앙의 왕이 누워있고, 그 주변에는 금은보화와 함께 노예들과 말들이 혼란스럽게 배치되어 있으며, 배경에는 불타오르는 궁전이 보입니다.", "풍부한 색채, 대담한 구도, 신체의 격정적인 표현들이 극적인 순간의 에너지와 비극성을 시각화하고 있습니다."], "src": "claude", "url": "https://namu.wiki/w/%EC%82%AC%EB%A5%B4%EB%8B%A4%EB%82%98%ED%8C%94%EB%A3%A8%EC%8A%A4%EC%9D%98%20%EC%A3%BD%EC%9D%8C"}}, {"title": "나폴레옹 1세의 대관식", "fr": "Le Sacre de l'empereur Napoléon Ier et le couronnement de l'impératrice Joséphine", "artist": "자크루이 다비드", "year": "1805-1807", "room": "702", "namu": "나폴레옹 1세의 대관식", "en_wiki": "The Coronation of Napoleon", "where": "", "fame": 5, "d": {"s": ["자크루이 다비드가 1804년 나폴레옹의 대관식 장면을 그린 이 초대형 유화는, 혁명 이후 스스로를 황제로 선포한 나폴레옹의 권위와 위엄을 표현하기 위한 작품입니다.", "실제 역사적으로는 나폴레옹이 교황의 손에서 왕관을 받지 않고 직접 자신의 머리에 썼지만, 그림에서는 화려한 가족 모임과 교황의 축복이라는 이상화된 장면으로 표현되었습니다.", "이 그림은 다비드가 나폴레옹의 요청에 따라 여러 번 수정한 창작물로, 고딕식 대성당을 신고전주의 양식의 웅장한 공간으로 재해석했습니다.", "그림 속에서 흰 드레스의 모습으로 보이는 나폴레옹의 어머니, 축복을 하는 교황 비오 7세, 그리고 2층 좌측에서 스케치하는 다비드 자신을 발견할 수 있습니다.", "나폴레옹은 이 그림을 그리는 과정에서 여러 번 방문해 수정을 지시했으며, 완성된 작품은 루브르와 베르사유에 각각 설치된 두 개의 버전으로 현존합니다."], "src": "namu", "url": "https://namu.wiki/w/%ED%99%A9%EC%A0%9C%20%EB%82%98%ED%8F%B4%EB%A0%88%EC%98%B9%201%EC%84%B8%EC%9D%98%20%EB%8C%80%EA%B4%80%EC%8B%9D"}}, {"title": "호라티우스 형제의 맹세", "fr": "Le Serment des Horaces", "artist": "자크루이 다비드", "year": "1784", "room": "702", "namu": "호라티우스 형제의 맹세", "en_wiki": "Oath of the Horatii", "where": "", "fame": 4, "d": {"s": ["이 그림은 고대 로마의 호라티우스 형제 세 명이 알바 롱가와의 전쟁에서 자신들의 도시를 위해 싸우겠다고 맹세하는 순간을 담고 있습니다.", "프랑스 혁명 직전인 1784년에 그려진 이 작품은 개인적 이익보다 국가와 공공선을 우선하는 시민 미덕을 강조하려는 신고전주의적 의도를 반영하고 있습니다.", "구도 측에 아버지가 검을 들고 있고, 우측에 여인들이 불안한 표정으로 앉아 있으며, 중앙의 세 형제는 각각 검을 들고 엄숙한 자세로 맹세를 하고 있습니다.", "양쪽으로 대칭된 기둥과 아치의 고전적 건축 배경은 스토아(현관홀)의 엄숙함을 드러내며, 차가운 색감과 명확한 선의 윤곽이 신고전주의 양식의 특징을 보여줍니다.", "이 작품은 프랑스 혁명을 앞둔 시대의 시민 정신을 고취하기 위한 정치적 메시지를 담은 신고전주의 회화의 대표작으로 평가됩니다."], "src": "claude", "url": "https://namu.wiki/w/%ED%98%B8%EB%9D%BC%ED%8B%B0%EC%9A%B0%EC%8A%A4%20%ED%98%95%EC%A0%9C%EC%9D%98%20%EB%A7%B9%EC%84%B8"}}, {"title": "사비니 여인들의 중재", "fr": "L'Enlèvement des Sabines (Les Sabines)", "artist": "자크루이 다비드", "year": "1799", "room": "702", "namu": "사비니 여인들의 중재", "en_wiki": "The Intervention of the Sabine Women", "where": "", "fame": 4, "d": {"s": ["이 작품은 고대 로마 건국의 초기 역사에서 나온 '사비니 여인 약탈' 사건을 주제로 그린 그림입니다.", "로마의 건국자 로물루스가 여성 부족을 구하기 위해 사비니 부족의 여인들을 강제로 빼앗아간 사건인데, 다비드는 이 극적인 순간을 신고전주의 양식으로 표현했습니다.", "프랑스 혁명 이후의 분위기 속에서 그려진 이 작품은 폭력과 질서, 국가 형성의 비극적 기초라는 복잡한 주제를 다루고 있습니다.", "화면 중앙의 로물루스는 높이 들려 있고, 주변으로 흩어진 로마 병사들과 저항하는 사비니 여인들, 그리고 슬픔에 잠긴 부모들의 모습이 극적으로 구성되어 있습니다.", "신고전주의의 정통성을 보여주듯 엄격한 구도, 선명한 색감, 고대 역사에 대한 정확한 고증을 통해 역사화의 최고 장르로서의 위상을 입증하고 있습니다."], "src": "claude", "url": "https://namu.wiki/w/%EC%82%AC%EB%B9%84%EB%8B%88%20%EC%97%AC%EC%9D%B8%EB%93%A4%EC%9D%98%20%EC%A4%91%EC%9E%AC"}}, {"title": "레카미에 부인의 초상", "fr": "Portrait de Madame Récamier", "artist": "자크루이 다비드", "year": "1800", "room": "702", "namu": "레카미에 부인의 초상", "en_wiki": "Portrait of Madame Récamier", "where": "", "fame": 4, "d": {"s": ["자크루이 다비드가 1800년에 그린 이 작품은 나폴레옹 시대 파리의 명망 있는 살롱 주인 레카미에 부인의 초상화입니다.", "신고전주의 미술의 거장 다비드가 당시 가장 영향력 있는 문화 인물 중 한 명이었던 그녀를 화폭에 담은 것으로, 19세기 초 파리 사교계의 면모를 보여주는 역사적 기록입니다.", "화면 구성에서 부인은 일반적인 초상화의 수직 자세가 아닌 누운 자세로 나타나며, 이는 고전 미술에서 영감을 받은 우아하고 신비로운 표현 방식입니다.", "배경의 소박한 실내 공간과 부인 곁의 테이블 위 조각상, 창문으로 보이는 풍경 등 세부적인 소품들이 그녀의 교양 있는 신분과 취향을 암시합니다.", "이 초상화는 대제국 시대 프랑스 고급 문화의 이상화된 모습을 보여주면서 동시에 초상화 장르에서 새로운 구성 방식을 제시한 중요한 작품입니다."], "src": "claude", "url": "https://namu.wiki/w/%EB%A0%88%EC%B9%B4%EB%AF%B8%EC%97%90%20%EB%B6%80%EC%9D%B8%EC%9D%98%20%EC%B4%88%EC%83%81"}}, {"title": "그랑드 오달리스크", "fr": "La Grande Odalisque", "artist": "장오귀스트도미니크 앵그르", "year": "1814", "room": "702", "namu": "그랑드 오달리스크", "en_wiki": "La Grande Odalisque", "where": "", "fame": 5, "d": {"s": ["이 그림은 오스만 제국의 궁전에서 후궁을 일컫는 '오달리스크'라는 여인을 묘사한 작품으로, 19세기 유럽의 오리엔탈리즘 화풍을 대표합니다.", "나폴레옹 이후 프랑스 신고전주의가 주류였던 시대에 앵그르가 동양의 이국적인 소재를 그린 것은 당시 유럽 미술계에서 새로운 미적 취향을 반영한 것입니다.", "화면 왼쪽에 평행한 두 척추뼈를 더한 듯 비정상적으로 길어진 등과 몸이 보이는데, 이는 고대 미술과 동양 미학의 영향을 받은 앵그르의 독창적인 표현 방식입니다.", "여인이 거울과 함께 보여주는 물건들, 머리에 감싼 터번, 그리고 배경의 동양식 무늬와 베개들은 이 작품이 추구하는 오리엔탈리즘의 미적 설정을 완성합니다.", "이 작품은 이후 유럽 미술사에서 오리엔탈리즘 미술의 표본이 되었으며, 동시에 여성의 신체를 관음적으로 표현한 남성 중심의 시각에 대한 비판의 대상이 되어왔습니다."], "src": "claude", "url": "https://namu.wiki/w/%EA%B7%B8%EB%9E%91%EB%93%9C%20%EC%98%A4%EB%8B%AC%EB%A6%AC%EC%8A%A4%ED%81%AC"}}, {"title": "모나리자", "fr": "La Joconde (Portrait de Lisa Gherardini)", "artist": "레오나르도 다 빈치", "year": "1503~1519년경", "room": "711", "namu": "모나리자", "en_wiki": "Mona Lisa", "where": "방 안쪽 벽 중앙, 방탄 유리 안", "fame": 5, "d": {"s": ["이 작품은 레오나르도 다 빈치가 1503년에서 1519년경 사이에 제작한 유화 초상화로, 피렌체 유력자 프란체스코 델 조콘도의 아내 리사 델 조콘도를 모델로 그렸다고 알려져 있습니다.", "다 빈치는 이 그림을 죽을 때까지 곁에 두고 다녔으며, 이렇게 특별히 소중히 여긴 작품이기에 레오나르도의 대표작이자 더욱 의미 있는 위치를 차지하게 되었습니다.", "이 초상화는 당시 혁신적 기법들을 담고 있는데, 정면을 바라보는 자연스러운 구도, 원근법이 적용된 배경, 그리고 입가의 신비로운 미소가 특징이며, 특히 배경은 토스카나 계곡을 모델로 한 가공의 풍경입니다.", "눈썹이 없는 것이 유명한데, 이는 원래 그려졌던 눈썹이 세월이 지나며 변색되거나 복원 과정에서 벗겨진 것으로 추정되고 있습니다.", "세로 77센티미터, 가로 53센티미터로 생각보다 작은 크기이며, 르네상스 시대를 대표하는 거장의 세밀한 기술과 인물의 원숙한 표현이 돋보이는 작품입니다."], "src": "namu", "url": "https://namu.wiki/w/%EB%AA%A8%EB%82%98%EB%A6%AC%EC%9E%90"}}, {"title": "가나의 혼인 잔치", "fr": "Les Noces de Cana", "artist": "파올로 베로네세", "year": "1563", "room": "711", "namu": "", "en_wiki": "The Wedding Feast at Cana", "where": "모나리자 맞은편 벽면의 대형 화면", "fame": 5, "d": {"s": ["베로네세는 성경 요한복음에서 예수가 행한 첫 번째 기적인 가나의 혼인잔치 장면을 그렸습니다. 이는 예수가 결혼식 피로연에서 떨어진 포도주를 물로 기적적으로 변화시킨 사건을 묘사한 것입니다.", "1563년에 그려진 이 대작은 르네상스 시대 베네치아 미술의 발전을 보여주는 작품으로, 당시 헬레니즘 문화권에서 포도주의 신 디오니소스 숭배에 대항하여 예수의 우월성을 강조하려는 교회의 의도가 반영되어 있습니다.", "화면에는 예수와 성모 마리아, 제자들과 결혼식 하객들이 함께 모여 있는 성대한 연회장면이 펼쳐져 있으며, 루브르 박물관 소장 회화 중 가장 큰 크기의 작품입니다.", "그림 속에서 직접 관찰할 수 있는 흥미로운 디테일은 여섯 개의 항아리인데, 성경 기사에 따르면 이 항아리들에 채워진 물이 포도주로 변했으며 그 양은 현대로 환산하면 와인병 600병에 해당하는 막대한 분량이었습니다.", "베로네세는 이 기적의 장면을 화려하고 웅장한 건축물과 많은 인물들이 등장하는 르네상스식 연회장으로 재구성하여, 신의 권능을 시각적으로 웅장하게 표현하였습니다."], "src": "namu", "url": "https://namu.wiki/w/%EA%B0%80%EB%82%98%EC%9D%98%20%ED%98%BC%EC%9D%B8%EC%9E%94%EC%B9%98"}}, {"title": "암굴의 성모", "fr": "La Vierge aux rochers", "artist": "레오나르도 다 빈치", "year": "1483~1486년경", "room": "710", "namu": "암굴의 성모", "en_wiki": "Virgin of the Rocks", "where": "레오나르도 작품 구역", "fame": 4, "d": {"s": ["이 작품은 레오나르도 다 빈치가 밀라노에서 개인 의뢰를 받아 그린 초기 작품으로, 성모 마리아가 예수와 세례자 요한 두 아기를 암굴 속에서 보호하는 장면을 묘사하고 있습니다.", "1483년부터 1486년경에 완성되었으며, 목재 패널에 유채로 그려진 후 보존을 위해 캔버스로 옮겨졌고, 1625년부터 프랑스 왕실에 소유되어 현재 루브르 박물관에 보관되어 있습니다.", "처음 완성된 이 버전은 두 아기 중 누가 예수이고 누가 세례자 요한인지 불명확하다는 비판을 받았습니다.", "화면의 인물들을 자세히 살피면 성모 마리아의 시선 방향과 천사 우리엘의 손가락이 가리키는 지점에서 각 인물의 신원을 파악할 수 있습니다.", "다 빈치는 이러한 비판에 응하여 배경의 명암을 재구성하고 예수와 세례자 요한을 더욱 분명하게 표현한 두 번째 버전을 그렸으며, 그 버전은 런던 내셔널 갤러리에 소장되어 있습니다."], "src": "namu", "url": "https://namu.wiki/w/%EC%95%94%EA%B5%B4%EC%9D%98%20%EC%84%B1%EB%AA%A8"}}, {"title": "성 안나와 성모자", "fr": "La Vierge, l'Enfant Jésus et sainte Anne", "artist": "레오나르도 다 빈치", "year": "1503~1519년경", "room": "710", "namu": "성 안나와 성모자", "en_wiki": "The Virgin and Child with Saint Anne (Leonardo)", "where": "레오나르도 작품 구역", "fame": 4, "d": {"s": ["이 작품은 예수의 어머니 마리아, 어린 예수, 그리고 마리아의 어머니 성 안나 세 인물을 함께 그린 종교화로, 특별히 세 세대의 혈연관계를 시각적으로 표현합니다.", "레오나르도는 16세기 초 밀라노에서 이 작품을 제작했으며, 완성에 약 16년이 걸렸을 정도로 오랜 기간 고민하며 그렸던 중요한 유작입니다.", "이 그림은 르네상스 시대 종교미술의 걸작으로, 기하학적 구도와 심오한 정신적 의미를 담으려는 레오나르도의 예술철학을 보여줍니다.", "작품을 자세히 보면 인물들 간의 신체적 밀착과 부드러운 터치, 특히 안나의 얼굴에서 유발되는 신비로운 미소가 특징적이며, 피라미드 구도로 안정감 있게 배치되어 있습니다.", "손과 눈의 방향을 따라가면 세 인물이 하나의 영적 연결고리로 묶여 있음을 느낄 수 있으며, 배경의 이상한 지형까지 포함한 모든 요소가 신성한 주제를 강조합니다."], "src": "claude", "url": "https://namu.wiki/w/%EC%84%B1%20%EC%95%88%EB%82%98%EC%99%80%20%EC%84%B1%EB%AA%A8%EC%9E%90"}}, {"title": "세례자 성 요한", "fr": "Saint Jean Baptiste", "artist": "레오나르도 다 빈치", "year": "1513~1516년경", "room": "710", "namu": "", "en_wiki": "Saint John the Baptist (Leonardo)", "where": "레오나르도 작품 구역", "fame": 4, "d": {"s": ["이 회화는 성경에 등장하는 역사적 인물 세례자 요한을 그린 것으로, 예수가 등장하기 직전 팔레스타인에서 세례를 베풀며 활동했던 구약 시대 최후의 예언자를 주제로 삼고 있습니다.", "르네상스 시대 대가 레오나르도 다 빈치가 1513년에서 1516년 사이에 완성한 이 작품은, 다 빈치의 새로운 화법 실험과 공기 원근법 구사의 시도가 돋보이는 작품입니다.", "그림 속 세례자 요한은 오른손을 들어 올리고 부드러운 표정으로 미소 짓는 모습으로 표현되며, 낙타 가죽 옷을 입은 고행자의 외형과 갈대로 만든 십자가를 지팡이처럼 들고 있는 상징적 요소가 직접 보입니다.", "다 빈치는 이 인물이 사람들을 회개로 이끌고 메시아의 도래를 준비한 선구자로서의 역할을 시각적으로 표현하기 위해 중성적이고 관능적인 특징을 부여한 것으로 알려집니다.", "현재 루브르 박물관에 소장된 이 작품은 다 빈치의 독특한 미소와 신비로운 배경 처리 기법이 특징이며, 종교적 인물을 인간미 있게 재현한 르네상스 회화의 대표작입니다."], "src": "namu", "url": "https://namu.wiki/w/%EC%84%B8%EB%A1%80%EC%9E%90%20%EC%9A%94%ED%95%9C?rev=291"}}, {"title": "라 벨 페로니에르", "fr": "La Belle Ferronnière", "artist": "레오나르도 다 빈치(추정)", "year": "1490~1497년경", "room": "710", "namu": "라 벨 페로니에르", "en_wiki": "La Belle Ferronnière", "where": "레오나르도 작품 구역", "fame": 3, "d": {"s": ["이 작품은 르네상스 시대 미술의 거장 레오나르도 다 빈치가 1490년대 후반에 그린 초상화로, 신원이 명확하지 않은 여성을 대상으로 합니다.", "당시 이탈리아 귀족 사회에서 여성의 초상화는 신분과 부의 상징이었으며, 제목의 '페로니에르'는 이마에 걸친 보석으로 장식된 체인을 뜻합니다.", "다 빈치는 인물의 얼굴에 신비로운 표정과 균형잡힌 구도를 통해 심리적 깊이를 표현하려 했으며, 이는 그의 초상화 전통에서 혁신적인 시도였습니다.", "작품을 자세히 보면 정교하게 묘사된 갈색 머리카락, 얇은 명주 소재의 드레스, 그리고 목과 이마를 장식한 황금 체인과 보석들을 발견할 수 있습니다.", "현재 루브르 박물관에 소장된 이 작품은 다 빈치 진작 여부가 학자들 사이에서 논쟁이 있으나, 르네상스 초상화의 우아함과 기술적 완성도를 보여주는 중요한 사례로 평가됩니다."], "src": "claude", "url": "https://namu.wiki/w/%EB%9D%BC%20%EB%B2%A8%20%ED%8E%98%EB%A1%9C%EB%8B%88%EC%97%90%EB%A5%B4"}}, {"title": "성모 마리아의 대관", "fr": "Le Couronnement de la Vierge", "artist": "프라 안젤리코", "year": "1430~1432년경", "room": "710", "namu": "", "en_wiki": "Coronation of the Virgin (Fra Angelico)", "where": "초기 르네상스 구역", "fame": 3, "d": {"s": ["이 작품은 성모 마리아가 예수 그리스도로부터 왕관을 받는 장면을 그린 종교화로, 15세기 초 이탈리아 르네상스 미술의 대표작입니다.", "프라 안젤리코는 도미니코회 수도사이자 화가로서 종교적 신앙심을 바탕으로 이 작품을 제작했으며, 중세 후기 마리아 신앙이 절정에 달했던 시대의 신학적 관심을 반영하고 있습니다.", "화면 위쪽 중앙에는 예수와 마리아가 함께 있고, 주변을 천사와 성인들이 둘러싸고 있으며, 황금색 배경이 신성함을 강조하고 있습니다.", "마리아의 얼굴과 옷주름은 섬세하게 표현되어 있으며, 개별 인물들의 얼굴에서 서로 다른 표정과 개성을 찾아볼 수 있습니다.", "이 작품은 종교적 주제를 우아하고 평온한 방식으로 표현한 프라 안젤리코의 독특한 화풍을 잘 보여주며, 초기 르네상스 미술에서 전통적 신앙과 새로운 미술 기법의 결합을 드러냅니다."], "src": "claude", "url": ""}}, {"title": "마에스타 (천사들에게 둘러싸인 성모자)", "fr": "La Vierge et l'Enfant en majesté entourés de six anges (Maestà)", "artist": "치마부에", "year": "1280년경", "room": "710", "namu": "", "en_wiki": "Maestà (Cimabue, Louvre)", "where": "갤러리 초입의 13세기 작품 구역", "fame": 3, "d": {"s": ["이 작품은 13세기 이탈리아 화가 치마부에가 그린 성모자상으로, 성모 마리아가 아기 예수를 안고 있으며 여섯 명의 천사들로 둘러싸여 있는 종교화입니다.", "13세기 말 피렌체 미술의 중요한 시기에 제작된 이 그림은 비잔틴 전통의 영향을 받으면서도 당시 이탈리아 미술의 새로운 방향을 보여주는 작품입니다.", "구성면에서 중심의 성모자는 정면을 향해 엄숙하고 위엄 있게 표현되었으며, 양쪽으로 대칭적으로 배치된 천사들이 그들을 경배하는 자세를 취하고 있습니다.", "금색 바탕에 그려진 이 작품에서는 섬세한 금박 장식, 천사들의 다양한 표정과 자세, 성모와 예수의 차분한 표현 등이 세밀하게 관찰할 수 있습니다.", "치마부에는 이러한 종교화 제작을 통해 이탈리아 르네상스 미술의 선구자로서 위상을 확립했으며, 이후 미술사에 중요한 영향을 미쳤습니다."], "src": "claude", "url": ""}}, {"title": "성 프란치스코의 성흔", "fr": "Les Stigmates de saint François d'Assise", "artist": "조토 디 본도네", "year": "1295~1300년경", "room": "710", "namu": "", "en_wiki": "Stigmatization of Saint Francis (Giotto)", "where": "갤러리 초입의 13~14세기 작품 구역", "fame": 3, "d": {"s": ["조토 디 본도네가 13세기 말 그린 이 작품은 가톨릭 역사에서 가장 신비로운 사건인 아시시의 성 프란치스코가 기적적으로 겪은 오상(성흔)의 순간을 포착한 패널화입니다.", "프란치스코는 라베르나 산에서의 기도와 명상 중에 여섯 날개를 가진 세라핌 천사 모습의 예수를 환상으로 보았고, 깨어나니 손과 발에 예수의 못 자국이 본따진 상처가 생겨났다고 전해집니다.", "이 성흔은 교황청에서 역사상 유일하게 공식 인정한 초자연 현상으로, 프란치스코의 거룩함과 예수에 대한 극렬한 신앙을 보여주는 증거가 되었습니다.", "그림 속에서는 하늘에서 내려오는 빛과 천사의 형상, 그리고 프란치스코의 몸에 나타나는 다섯 군데 상처, 함께 있는 동료 수사의 놀란 표정 등을 세부적으로 관찰할 수 있습니다.", "중세의 거장 조토는 이 작품을 통해 기존의 평면적 중세 양식을 벗어나 입체감과 공간감을 표현함으로써 르네상스 미술의 길을 열었습니다."], "src": "namu", "url": "https://namu.wiki/w/%EC%95%84%EC%8B%9C%EC%8B%9C%EC%9D%98%20%ED%94%84%EB%9E%80%EC%B9%98%EC%8A%A4%EC%BD%94"}}, {"title": "천사들에 둘러싸인 장엄한 성모", "fr": "La Vierge et l'Enfant en majesté entourés de six anges (Maestà)", "artist": "치마부에", "year": "1280년경", "room": "709", "namu": "", "en_wiki": "Maestà (Cimabue, Louvre)", "where": "", "fame": 4, "d": {"s": ["이 작품은 예수 아기를 안고 있는 성모 마리아를 중심에 배치하고, 그 주위를 여섯 명의 천사들이 둘러싸고 있는 종교화입니다.", "13세기 후반 이탈리아 화가 치마부에에 의해 그려진 이 그림은 비잔틴 미술 전통을 따르면서도 중세 후기 화풍으로의 전환을 보여주는 작품입니다.", "금색 바탕에 배경을 채운 비잔틴식 기법과 엄격한 위계적 구성은 성모의 신성함과 권위를 강조하는 마에스타(Maestà) 도상의 전형을 따르고 있습니다.", "화면 곳곳에서 성모와 아기 예수의 우아한 신체 표현, 정교한 금색 자수 문양의 의복, 그리고 천사들의 고요한 표정과 자세를 자세히 관찰할 수 있습니다.", "이 작품은 중세 미술이 르네상스로 나아가는 과도기적 특성을 지니고 있으며, 종교적 경건함을 표현하는 당대의 주요 양식을 보여주는 중요한 사례입니다."], "src": "claude", "url": ""}}, {"title": "산 로마노의 전투", "fr": "La Bataille de San Romano", "artist": "파올로 우첼로", "year": "1435~1440년경", "room": "708", "namu": "", "en_wiki": "The Battle of San Romano", "where": "", "fame": 4, "d": {"s": ["이 작품은 1432년 피렌체와 시에나 사이에 벌어진 산 로마노 전투를 그린 것으로, 당시 피렌체의 승리를 기념하기 위해 제작되었습니다.", "르네상스 초기 미술가 파올로 우첼로는 선형 원근법을 활용하여 전투 장면에 깊이감과 질서를 부여했으며, 이는 당시로서는 혁신적인 시도였습니다.", "이 대형 목판화들은 원래 피렌체의 한 궁전을 장식하기 위해 세 폭으로 제작되었는데, 루브르 박물관에 소장된 것은 그 중 하나입니다.", "그림 속에서 중앙의 휘어진 창과 기하학적으로 배치된 말과 기병들, 그리고 후퇴하는 적군의 모습에서 화가의 기하학적 구성에 대한 관심을 발견할 수 있습니다.", "금색 옷을 입은 주요 인물들과 생생한 색감의 말들은 전쟁의 혼란 속에서도 질서와 우아함을 유지하는 르네상스식 전투 표현의 특징을 보여줍니다."], "src": "claude", "url": ""}}, {"title": "성모 대관", "fr": "Le Couronnement de la Vierge", "artist": "프라 안젤리코", "year": "1430~1432년경", "room": "708", "namu": "", "en_wiki": "Coronation of the Virgin (Fra Angelico)", "where": "", "fame": 3, "d": {"s": ["이 그림은 성모 마리아가 예수 그리스도로부터 왕관을 받는 장면을 그린 종교화입니다.", "15세기 초 이탈리아 르네상스 시대에 그려진 이 작품은 중세 기독교 미술의 주요 주제 중 하나로, 마리아의 영광과 신성함을 강조하는 신학적 의미를 담고 있습니다.", "화면의 중심에는 옥좌에 앉은 예수와 마리아가 배치되어 있고, 주변을 천사들과 성인들이 둘러싸고 있는 위계적 구성을 보여줍니다.", "프라 안젤리코 특유의 밝고 투명한 색감, 특히 금색 배경과 섬세한 금박 장식이 작품 전체에 신성한 분위기를 더하고 있습니다.", "인물들의 얼굴 표현과 옷주름이 세밀하게 표현되어 있으며, 화려한 의복과 장식품들이 당시 플로렌스 미술의 정교한 기법을 보여줍니다."], "src": "claude", "url": ""}}, {"title": "사모트라케의 니케", "fr": "Victoire de Samothrace", "artist": "미상 (헬레니즘 시대)", "year": "기원전 190년경", "room": "703", "namu": "사모트라케의 니케", "en_wiki": "Winged Victory of Samothrace", "where": "다뤼 계단 꼭대기", "fame": 5, "d": {"s": ["이 조각상은 승리의 여신 니케가 배의 뱃머리 위에 내려앉으려는 역동적인 순간을 표현한 것입니다.", "기원전 190년경 로도스의 에우다모스가 셀레우코스 왕조의 해전에서 승리한 것을 기념하기 위해 사모트라케 섬의 위대한 신들의 성소에 봉헌된 작품입니다.", "헬레니즘 시대의 뛰어난 조각 기술을 보여주는 고대 그리스 미술의 승리를 대표하는 유물이자, 19세기 고고학의 복원 기술을 자랑할 수 있는 상징적인 작품입니다.", "현재 팔과 머리, 그리고 발이 없고 오른쪽 날개도 일부 손상되어 있지만, 남은 근육 형태로 보아 오른쪽 팔은 앞으로 뻗거나 위로 올렸고 왼쪽 팔은 뒤로 흘렀을 것으로 추정됩니다.", "1950년경 발견된 오른손 조각을 통해 손가락 형태가 확인되었으며, 그 모양으로 보아 월계관 같은 승리의 상징물을 들고 있었을 가능성이 있습니다."], "src": "namu", "url": "https://namu.wiki/w/%EB%8B%88%EC%BC%80?uuid=a54d9d63-5bbd-4e3d-8e17-ab3b00c205c4"}}, {"title": "밀로의 비너스", "fr": "Vénus de Milo", "artist": "미상 (안티오키아의 알렉산드로스로 추정)", "year": "기원전 130~100년경", "room": "345", "namu": "밀로의 비너스", "en_wiki": "Venus de Milo", "where": "방 중앙 안쪽", "fame": 5, "d": {"s": ["이 조각상은 그리스 신화의 사랑과 미의 여신 아프로디테를 파리안 대리석으로 만든 작품입니다.", "헬레니즘 시대의 미술 양식을 보여주는 이 조각상은 기원전 2세기경 제작된 것으로 추정되며, 다양한 역사적 시대의 표현 기법이 혼합되어 있습니다.", "1820년 그리스 밀로스섬의 농부가 발견한 후 프랑스로 옮겨져 현재 루브르 박물관에 소장되어 있습니다.", "작품을 자세히 보면 하반신에 드레이프된 천의 우아한 주름이 돋보이고, 머리는 왼쪽으로 향하고 있으며, 발견 당시부터 양팔과 왼발이 없어 완성된 형태가 어떠했는지는 여전히 의문으로 남아 있습니다.", "나선형의 곡선미와 머리와 팔의 1대 8 비율로 표현된 신체 구성은 헬레니즘 시대의 혁신적인 조각 기법을 대표하는 특징입니다."], "src": "namu", "url": "https://namu.wiki/w/%EB%B0%80%EB%A1%9C%EC%9D%98%20%EB%B9%84%EB%84%88%EC%8A%A4"}}, {"title": "큐피드의 키스로 되살아나는 프시케", "fr": "Psyché ranimée par le baiser de l'Amour", "artist": "안토니오 카노바", "year": "1787~1793년", "room": "403", "namu": "", "en_wiki": "Psyche Revived by Cupid's Kiss", "where": "", "fame": 4, "d": {"s": ["이 대리석 조각상은 로마 신화 속 프시케가 큐피드의 입맞춤으로 죽음에서 깨어나는 순간을 표현한 작품입니다.", "18세기 신고전주의 미술의 거장 카노바가 1787년부터 1793년에 걸쳐 완성한 이 작품은, 고전 신화를 현대적으로 재해석하려던 당대 예술 운동을 대표합니다.", "조각상에서 큐피드는 프시케 위로 몸을 구부리고 있으며, 프시케는 부드럽게 깨어나는 몸의 자세와 표정으로 생명이 돌아오는 순간을 섬세하게 담아냅니다.", "두 인물의 해부학적 정확성과 함께 드러나는 우아한 곡선들, 그리고 대리석으로 표현한 부드러운 직물의 질감은 신고전주의 조각의 기술적 완성도를 보여줍니다.", "이 작품은 죽음과 사랑, 영혼의 구원이라는 주제로 유럽의 신고전주의 미술에 깊은 영향을 미쳤습니다."], "src": "claude", "url": ""}}, {"title": "빈사의 노예", "fr": "Esclave mourant", "artist": "미켈란젤로", "year": "1513~1516년", "room": "403", "namu": "", "en_wiki": "Dying Slave", "where": "", "fame": 4, "d": {"s": ["이 작품은 미켈란젤로가 16세기 초에 조각한 대리석 조각으로, 눈을 감은 채 몸을 늘어뜨린 젊은 남성의 모습을 담고 있습니다.", "원래 교황 율리우스 2세의 무덤을 장식하기 위해 제작되었던 작품으로, 당시 교황의 권력을 드러내는 거대한 기념비적 구조물의 일부였습니다.", "고대 로마의 헬레니즘 미술에 영감을 받아 만들어졌으며, 인간의 신체를 정확하게 표현하려는 르네상스 시대의 예술적 관심을 잘 보여줍니다.", "몸의 근육 표현이 정교하고, 특히 팔과 다리의 유연한 곡선, 그리고 얼굴의 고뇌 어린 표정이 섬세하게 조각되어 있습니다.", "완성되지 못한 여러 작품들과 함께 남겨졌으나, 미켈란젤로의 인체 표현 능력과 르네상스 미술의 정점을 보여주는 중요한 작품으로 평가받고 있습니다."], "src": "claude", "url": ""}}, {"title": "함무라비 법전", "fr": "Code de Hammurabi", "artist": "미상 (바빌로니아)", "year": "기원전 1754년경", "room": "227", "namu": "함무라비 법전", "en_wiki": "Code of Hammurabi", "where": "", "fame": 4, "d": {"s": ["이 검은 석재는 기원전 1755년경 고대 바빌로니아의 함무라비 왕이 제정한 법전으로, 쐐기 문자로 새겨진 282개 조항의 법률을 담고 있습니다.", "1901년 프랑스 발굴단에 의해 이란의 수사에서 발견된 이 석주는 왕의 권위를 상징하는 물리적 증거이자, 당시 사회의 법적 질서를 기록한 역사적 문서입니다.", "함무라비 법전은 인류 역사상 현존하는 가장 오래된 성문법 중 하나로서, 상인, 농민, 노예 등 사회 각 계층의 권리와 의무를 규정함으로써 법치주의의 발전을 보여줍니다.", "석재의 상단에는 태양신 샤마시로부터 법전을 받는 함무라비의 모습이 부조로 조각되어 있으며, 이는 법의 신성성과 왕의 신적 정당성을 표현하고 있습니다.", "\"눈에는 눈을\"이라는 유명한 동해 보복법을 포함한 이 법전의 조항들은 신분에 따라 처벌 수준을 달리하여 당시 사회의 위계질서를 명확히 반영하고 있습니다."], "src": "namu", "url": "https://namu.wiki/w/%ED%95%A8%EB%AC%B4%EB%9D%BC%EB%B9%84%20%EB%B2%95%EC%A0%84"}}, {"title": "레이스 뜨는 여인", "fr": "La Dentellière", "artist": "요하너스 페르메이르", "year": "1669–1670년경", "room": "837", "namu": "", "en_wiki": "The Lacemaker (Vermeer)", "where": "", "fame": 5, "d": {"s": ["이 그림은 17세기 네덜란드의 화가 페르메이르가 그린 작품으로, 레이스를 뜨고 있는 젊은 여인의 모습을 담고 있습니다.", "당시 네덜란드는 경제적으로 풍요로웠고, 레이스 제작은 숙련된 기술이 필요한 귀한 수공예 일로서 중산층 여성들의 일과 여가를 나타내는 주제였습니다.", "페르메이르는 빛과 색감의 섬세한 표현으로 유명했는데, 이 작품에서도 창문을 통해 들어오는 부드러운 빛이 여인의 얼굴과 작업 중인 손을 밝게 비추고 있습니다.", "그림의 세부를 보면 여인이 집중한 표정으로 레이스 작업에 몰두하고 있으며, 그 앞에는 실패와 바늘 등 작업 도구들이 정교하게 그려져 있습니다.", "이 작품은 당시 미천하다고 여겨지던 일상의 장면을 고급 미술의 대상으로 격상시킨 페르메이르의 예술적 관점을 보여주는 중요한 사례입니다."], "src": "claude", "url": ""}}, {"title": "천문학자", "fr": "L'Astronome", "artist": "요하너스 페르메이르", "year": "1668", "room": "837", "namu": "", "en_wiki": "The Astronomer (Vermeer)", "where": "", "fame": 4, "d": {"s": ["페르메이르가 1668년에 그린 이 작품은 천체 관측 기구를 들고 있는 한 남자의 모습을 담고 있으며, 17세기 과학 혁명 시대의 지식인 문화를 시각화한 장르화입니다.", "17세기 네덜란드는 무역 중심의 부유한 사회로 발전하면서 과학과 학문에 대한 관심이 높아졌던 시기였고, 이 작품은 그러한 시대정신을 반영하고 있습니다.", "화면 왼쪽의 밝은 창문은 관찰자의 집중력을 강조하며, 책상 위의 지구본, 천문 기구, 그리고 펼쳐진 서적들은 당시 지식인의 학문적 관심사를 구체적으로 보여줍니다.", "인물의 검은 옷과 흰 칼라, 그리고 실내의 조용한 분위기는 관상적 사유와 지적 활동의 진지함을 강조하는 페르메이르 특유의 표현 방식입니다.", "이 작품은 과학과 예술이 함께 발전했던 근대 초기 유럽 문명의 가치관을 기록한 중요한 문화유산으로 평가됩니다."], "src": "claude", "url": ""}}, {"title": "밧세바", "fr": "Bethsabée au bain tenant la lettre du roi David", "artist": "렘브란트 판 레인", "year": "1654", "room": "837", "namu": "", "en_wiki": "Bathsheba at Her Bath", "where": "", "fame": 4, "d": {"s": ["이 작품은 구약성서에 등장하는 밧세바가 목욕 중에 다윗 왕의 편지를 받는 장면을 그린 것입니다.", "렘브란트는 17세기 네덜란드에서 성서의 드라마틱한 순간들을 자주 소재로 삼았는데, 이 그림은 왕과 평민 여인 사이의 운명적 만남이라는 주제를 화폭에 담았습니다.", "밧세바가 앉아 있는 자세, 그녀 곁의 시녀들, 그리고 손에 들린 편지라는 구체적인 디테일들이 이 결정적인 순간을 드러내고 있습니다.", "어두운 배경 위에 밧세바의 몸에 집중되는 따뜻한 빛은 렘브란트 특유의 명암 기법을 보여주며, 이는 장면의 심각한 심리 상태를 강조합니다.", "이 그림은 권력 관계와 인간의 욕망이라는 종교적 주제를 예술적으로 표현한 바로크 시대의 중요한 작품입니다."], "src": "claude", "url": ""}}, {"title": "마르세유 상륙 (메디치 갤러리)", "fr": "Le Débarquement de Marie de Médicis à Marseille", "artist": "페테르 파울 루벤스", "year": "1622–1625", "room": "801", "namu": "", "en_wiki": "Marie de' Medici cycle", "where": "메디치 연작 중 한 점", "fame": 4, "d": {"s": ["이 그림은 1622년 피렌체의 메디치 가문 출신 마리아가 프랑스 왕 루이 13세와의 결혼을 위해 마르세유 항구에 상륙하는 역사적 사건을 담고 있습니다.", "루벤스는 마리아의 정치적 영향력과 부를 표현하기 위해 화려한 복장의 인물들과 해신 넵튠, 트리톤 같은 신화적 존재들을 함께 배치하여 이 혼인을 신성한 사건으로 승격시켰습니다.", "작품은 프랑스 왕비가 되는 마리아의 이 항해를 기념하기 위해 제작되었으며, 정치적 결혼을 통한 두 강국의 동맹을 시각화한 것입니다.", "화면의 중앙에 금색 드레스를 입은 여성이 배에서 내려오는 모습이 두드러지고, 주변으로 시종들과 궁정 인물들이 복잡하게 배치되어 있으며, 하늘과 바다에는 신화적 인물들이 축제의 분위기를 더합니다.", "루벤스 특유의 풍만한 형태감과 동적인 구도, 따뜻한 색감이 이 역사적 순간을 장엄하고 화려하게 표현해내고 있습니다."], "src": "claude", "url": ""}}, {"title": "마리 드 메디시스의 대관식 (메디치 갤러리)", "fr": "Le Couronnement de Marie de Médicis à Saint-Denis", "artist": "페테르 파울 루벤스", "year": "1622–1625", "room": "801", "namu": "", "en_wiki": "Marie de' Medici cycle", "where": "메디치 연작 중 한 점", "fame": 4, "d": {"s": ["이 작품은 프랑스 왕비 마리 드 메디시스가 1625년 생드니 대성당에서 대관식을 거행하는 장면을 담고 있습니다.", "루벤스는 플랑드르의 유명한 화가로서 메디시스 가문의 의뢰를 받아 마리의 생애를 주제로 한 대규모 회화 연작을 제작했으며, 이는 그 중 하나입니다.", "마리 드 메디시스는 이탈리아의 유명한 금융 가문에서 태어나 프랑스 왕 앙리 4세에게 시집온 왕비로, 이 그림은 그녀의 정치적 지위와 권력을 시각적으로 표현하는 역할을 했습니다.", "화면 중앙에는 왕관을 받는 마리가 화려한 의복으로 묘사되어 있고, 주변으로 천사들과 귀족들이 배치되어 있으며, 황금색 빛과 풍부한 색감이 장엄함을 더합니다.", "루벤스 특유의 풍만한 인물 표현과 동적인 구성은 왕실의 권위와 신성함을 강조하는 바로크 회화의 전형적인 특징을 보여줍니다."], "src": "claude", "url": ""}}, {"title": "터키탕", "fr": "Le Bain turc", "artist": "장 오귀스트 도미니크 앵그르", "year": "1862", "room": "940", "namu": "", "en_wiki": "The Turkish Bath", "where": "", "fame": 5, "d": {"s": ["이 작품은 터키의 전통 목욕탕 하맘을 배경으로 나른하게 누워있는 여러 명의 나체 여성들을 그린 그림입니다.", "앵그르는 당시 유럽에서 유행하던 오리엔탈리즘 사조에 영향을 받아 이처럼 튀르크풍의 누드화를 많이 제작했는데, 이 작품은 서양 남성들의 동방에 대한 판타지를 담은 산물이라 할 수 있습니다.", "타원형에 가까운 캔버스는 마치 열쇠구멍을 통해 몰래 들여다보는 느낌을 주도록 의도적으로 설계되었습니다.", "화면 중앙에서 악기를 튀는 여성의 신체는 극도로 아름답게 표현되어 있으며, 그의 독특한 데포르메 기법으로 인해 실제 인체 비례보다 허리가 길지만 오히려 더욱 우아해 보입니다.", "뒤를 돌아앉아 고개를 살짝 돌린 이 포즈는 앵그르가 다른 작품들에서도 반복해서 사용한 특징적인 표현 방식입니다."], "src": "namu", "url": "https://namu.wiki/w/%EB%8F%84%EB%AF%B8%EB%8B%88%ED%81%AC%20%EC%95%B5%EA%B7%B8%EB%A5%B4"}}, {"title": "코르사바드의 라마수 (인두 유익 황소상)", "fr": "Taureau androcéphale ailé (lamassu) de Khorsabad", "artist": "작자 미상 (사르곤 2세 궁전)", "year": "기원전 721–705년경", "room": "229", "namu": "라마수", "en_wiki": "Lamassu", "where": "코르사바드 안뜰 입구", "fame": 4, "d": {"s": ["이 석상은 인간의 머리, 황소의 몸, 새의 날개를 갖춘 라마수라는 고대 아시리아의 보호신을 표현한 작품입니다.", "원래 수메르 시대에는 여신 형       local.sort(function(a,b){return ((b.room===room)-(a.room===room))||(((b.d&&b.d.src)==='namu')-((a.d&&a.d.src)==='namu'))||((+b.fame||0)-(+a.fame||0));});
      S.items=local;$('roomName').textContent=room+'번 · '+(PRE.rooms[room]||'');syncChips();
      status(local.length+'점 · 미리 준비된 설명이라 바로 보여요');show(0,false);renderList();return;}
    if(!key){$('settings').hidden=false;status('설정에 API 키를 넣어 주세요.',true);return;}
    S.room=room;syncChips();lsSet('louvre_room',room);var gen=++S.gen,t0=Date.now();
    S.items=[];S.cur=-1;S.hist=[];renderList();$('roomName').textContent='';
    $('content').innerHTML='<div class="msg">'+esc(room)+'번 방의 그림을 고르는 중이에요.</div>';
    var tm=setInterval(function(){status('그림 목록 준비 중 '+Math.round((Date.now()-t0)/1000)+'초');},1000);
    try{
      var d=await claude({model:'claude-sonnet-5-5',max_tokens:12000,messages:[{role:'user',content:
        ['루브르 박물관 '+room+'번 전시실에 지금 있는 관람객을 위한 그림 목록이 필요합니다.',
         '이 방과 바로 이어진 방에 걸린 그림 중 유명한 작품, 특히 나무위키에 단독 문서가 있고 내용이 충실한 작품 위주로 최대 10점을 고르세요. 그 방에 걸려 있다고 확신하는 것만.',
         '유명도(fame 1~5)가 높은 순서로. 이 방(room이 '+room+')에 있는 작품을 먼저.',
         'namu는 나무위키 문서 제목을 정확히(예: 민중을 이끄는 자유의 여신). 단독 문서가 없을 것 같으면 빈 문자열.',
         'en_wiki는 영어 위키백과 문서 제목. where는 방 안에서 찾는 힌트(예: 들어가서 오른쪽 벽의 대형 그림), 모르면 빈 문자열.',
         '오직 JSON: {"room_name":"전시실 이름(예: 몰리앵 전시실, 19세기 프랑스 대형 회화)","items":[{"title":"","fr":"","artist":"","year":"","room":"","namu":"","en_wiki":"","where":"","fame":5}]}'].join('\n')}]});
      clearInterval(tm);if(gen!==S.gen)return;
      var res=parseJson(d),items=(res.items||[]).filter(function(x){return x&&x.title;});
      items.sort(function(a,b){return ((b.room==room)-(a.room==room))||((+b.fame||0)-(+a.fame||0));});
      if(!items.length){status('이 방 번호로는 그림을 찾지 못했어요. 번호를 확인해 주세요.',true);$('content').innerHTML='<div class="msg">그림을 찾지 못했어요.</div>';return;}
      S.items=items;$('roomName').textContent=room+'번 · '+(res.room_name||'');
      status(items.length+'점 · 25초마다 다음 그림으로 넘어가요');
      show(0,false);renderList();prefetch();
    }catch(e){clearInterval(tm);status(errText(e),true);$('content').innerHTML='<div class="msg">'+esc(errText(e))+'</div>';}
  }

  function dkey(it){return (it.namu||it.title)+'|'+it.artist;}
  async function describe(it){
    var k=dkey(it);if(S.desc[k]||S.pending[k])return;S.pending[k]=1;
    var url=it.namu?'https://namu.wiki/w/'+encodeURIComponent(it.namu):'';
    var p=(url?'다음 나무위키 문서를 web_fetch로 읽으세요: '+url+'\n':'')+
      '그림: '+it.title+' ('+it.fr+'), '+it.artist+', '+it.year+'. 루브르 박물관.\n'+
      '지금 이 그림 앞에 선 관람객에게 설명하는 한국어 5문장을 쓰세요. 무엇을 그린 그림인지, 탄생 배경과 역사적 의미, 그리고 그림 속에서 직접 찾아볼 디테일을 꼭 넣으세요.\n'+
      '사실관계가 확실한 내용만 쓰고, 과장된 평가는 빼세요. 문서 문장을 그대로 옮기지 말고 자기 말로 다시 쓰세요. 문서를 못 읽었으면 당신의 지식으로 쓰고 source를 "claude"로.\n'+
      '오직 JSON: {"source":"namu 또는 claude","sentences":["","","","",""]}';
    try{
      var body={model:'claude-haiku-4-5-20251001',max_tokens:4000,messages:[{role:'user',content:p}]};
      if(url)body.tools=[{type:'web_fetch_20250910',name:'web_fetch',max_uses:1,allowed_domains:['namu.wiki'],max_content_tokens:20000}];
      var d=await claude(body,url?'web-fetch-2025-09-10':null);
      var fetched=(d.content||[]).some(function(b){return b.type==='web_fetch_tool_result'&&b.content&&b.content.type==='web_fetch_result';});
      var r=parseJson(d),s=(r.sentences||[]).filter(Boolean).slice(0,5);
      if(!s.length)throw new Error('빈 설명');
      S.desc[k]={s:s,src:fetched&&r.source!=='claude'?'namu':'claude',url:url};saveDesc();
    }catch(e){S.desc[k]=null;status(errText(e),true);}
    finally{delete S.pending[k];var c=S.items[S.cur];if(c&&dkey(c)===k){renderCard();if(S.speak)speak();}renderList();}
  }
  async function prefetch(){var gen=S.gen;
    for(var i=0;i<S.items.length&&gen===S.gen;i++){var idx=(S.cur+i)%S.items.length,it=S.items[idx];if(!S.desc[dkey(it)])await describe(it);}}
  async function image(it){
    if(!it.en_wiki||S.img[it.en_wiki]!==undefined)return;S.img[it.en_wiki]='';
    try{var r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(it.en_wiki.replace(/ /g,'_')));var j=await r.json();
      S.img[it.en_wiki]=(j.thumbnail&&j.thumbnail.source)?j.thumbnail.source.replace(/\/\d+px-/,'/800px-'):'';
      var c=S.items[S.cur];if(c&&c.en_wiki===it.en_wiki)renderCard();}catch(e){}
  }

  function show(i,record){
    if(record&&S.cur>=0&&S.cur!==i){S.hist.push(S.cur);if(S.hist.length>30)S.hist.shift();}
    S.cur=i;S.remaining=INTERVAL;var it=S.items[i];renderCard();renderList();image(it);
    if(!S.desc[dkey(it)])describe(it);if(S.speak)speak();
  }
  function renderCard(){var it=S.items[S.cur];if(!it)return;var d=S.desc[dkey(it)],im=S.img[it.en_wiki];
    var desc=d?'<p class="desc">'+d.s.map(esc).join(' ')+'</p><div class="src">'+(d.src==='namu'?'나무위키 문서를 바탕으로 Claude가 요약 · <a href="'+esc(d.url)+'" target="_blank" rel="noopener">나무위키에서 전체 보기</a> (CC BY-NC-SA)':'Claude 설명'+(d.url?' · <a href="'+esc(d.url)+'" target="_blank" rel="noopener">나무위키</a>':''))+'</div>'
      :'<p class="desc wait">'+(d===null?'설명을 받지 못했어요. 다음을 눌렀다가 돌아오면 다시 시도해요.':'나무위키를 읽고 설명을 쓰는 중이에요...')+'</p>';
    $('content').innerHTML='<article class="card">'+(im?'<img class="img" loading="lazy" src="'+esc(im)+'" alt="'+esc(it.title)+'">':'')+
      '<div class="cb"><div class="meta">'+esc(it.room?it.room+'번 방':'')+(it.fame>=5?' · 대표작':'')+'</div><h2 class="title">'+esc(it.title)+'</h2>'+
      '<div class="sub">'+esc([it.artist,it.year].filter(Boolean).join(', '))+(it.fr?'<br>'+esc(it.fr):'')+'</div>'+
      (it.where?'<p class="where">찾는 법 · '+esc(it.where)+'</p>':'')+desc+'</div></article>';
    if(d===null)S.desc[dkey(it)]=undefined;}
  function renderList(){if(!S.items.length){$('list').innerHTML='';return;}
    $('list').innerHTML='<h2>이 방과 주변 그림</h2>'+S.items.map(function(it,i){var d=S.desc[dkey(it)];
      return '<button class="row" type="button" data-i="'+i+'"'+(i===S.cur?' aria-current="true"':'')+'><span>'+(i+1)+'. '+esc(it.title)+'</span><span>'+esc(it.room||'')+(d?' ✓':'')+'</span></button>';}).join('');}
  $('list').addEventListener('click',function(e){var b=e.target.closest('.row');if(b)show(+b.getAttribute('data-i'),true);});

  function speak(){if(!('speechSynthesis' in window))return;var it=S.items[S.cur],d=it&&S.desc[dkey(it)];if(!d)return;
    try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(it.title+'. '+d.s.join(' '));u.lang='ko-KR';speechSynthesis.speak(u);}catch(e){}}
  setInterval(function(){if(!S.paused&&S.items.length){var it=S.items[S.cur];if(S.desc[dkey(it)]||S.desc[dkey(it)]===null){S.remaining-=0.25;if(S.remaining<=0)show((S.cur+1)%S.items.length,true);}}
    $('bar').style.transform='scaleX('+Math.max(0,Math.min(1,S.remaining/INTERVAL))+')';},250);
  $('nextBtn').onclick=function(){if(S.items.length)show((S.cur+1)%S.items.length,true);};
  $('prevBtn').onclick=function(){if(S.hist.length)show(S.hist.pop(),false);};
  $('pauseBtn').onclick=function(){S.paused=!S.paused;this.setAttribute('aria-pressed',String(S.paused));this.textContent=S.paused?'재생':'정지';};
  $('speakBtn').onclick=function(){S.speak=!S.speak;this.setAttribute('aria-pressed',String(S.speak));if(S.speak)speak();else try{speechSynthesis.cancel();}catch(e){}};
  function step(n){var v=parseInt($('roomInput').value,10);if(!isFinite(v))v=700;$('roomInput').value=v+n;}
  $('minus').onclick=function(){step(-1);};$('plus').onclick=function(){step(1);};
  $('roomForm').addEventListener('submit',function(){$('roomInput').blur();loadRoom($('roomInput').value);});
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}
  var saved=lsGet('louvre_room');if(saved)$('roomInput').value=saved;
  loadRoom($('roomInput').value);
})();
</script>
</body>
</html>
